#
# Group 7: distributed tracing. Vigil sends no traces, and none of its
# integrations produces them, so both are available but not applicable:
# no Vigil test targets them, and tracing is not added to Vigil for them.
#
#   docker compose --profile tracing up -d

services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["jaeger", "tracing"]
    ports:
      - "127.0.0.1:16686:16686" # UI and query API
      - "127.0.0.1:4517:4317"   # OTLP gRPC
      - "127.0.0.1:4518:4318"   # OTLP HTTP

  zipkin:
    image: openzipkin/zipkin:3.6.1
    profiles: ["zipkin", "tracing"]
    ports:
      - "127.0.0.1:9411:9411"   # UI, API and the Zipkin span endpoint
