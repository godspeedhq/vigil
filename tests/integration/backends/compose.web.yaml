# The web servers the web packs (packs/nginx, httpd, caddy, haproxy, phpfpm)
# are tested against, each in trouble on purpose: scripts/run-web.sh starts
# them, with VIGIL_WEB_DIR set to its own copy of configs/services/web (the
# tests edit and reload it), with the certificates it makes and the folders
# the logs are written to. Every port is on 127.0.0.1 only.
#
#   nginx          nginx 1.30.8 (stable)   http 18180, https 18143 (expires in 5 days)
#   nginx-mainline nginx 1.31.10           http 18181, https 18144 (expired)
#   httpd          httpd 2.4.71, event     http 18280, https 18243 (no CA signed it)
#   httpd-prefork  httpd 2.4.71, prefork   http 18281
#   caddy          Caddy 2.11.9            admin 18219, http 18380, https 18343 (its own CA)
#   haproxy        HAProxy 3.4.8           http 18480, https 18443, runtime API 18499 and a socket file
#   haproxy32      HAProxy 3.2.27 (LTS)    http 18481, runtime API 18498
#   php86, php83   PHP-FPM 8.6.0 and 8.3.37, reached through nginx and httpd
#
