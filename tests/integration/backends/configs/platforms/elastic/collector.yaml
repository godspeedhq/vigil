# OTLP from Vigil, into Elasticsearch through the collector's elasticsearch
# exporter. Metrics and logs go to the indexes the exporter chooses for
# OTel data; verify.sh searches them for the test's own values.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  elasticsearch:
    endpoint: http://elasticsearch:9200
    auth:
      authenticator: basicauth/elastic
    # Once the collector answers Vigil, delivery is the collector's to
    # finish. By default this exporter retries twice, quickly, then drops:
    # Elasticsearch restarting lost a minute of data (run-checks.sh, check
    # 11). Retrying for a few minutes covers a restart.
    retry:
      enabled: true
      max_retries: 60
      initial_interval: 1s
      max_interval: 10s

extensions:
  # The image has no shell for a Compose health check: start.sh asks this
  # from the host.
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/elastic:
    client_auth:
      username: elastic
      password: ${env:ELASTIC_PASSWORD}

service:
  extensions: [health_check, basicauth/elastic]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch]
