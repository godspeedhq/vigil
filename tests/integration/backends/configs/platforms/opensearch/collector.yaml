# OTLP from Vigil, into OpenSearch through the collector's opensearch
# exporter, verifying OpenSearch's demo certificate against its root CA
# (copied out by ca.sh), under the name the certificate carries. Vigil's
# own hop to the collector is plain HTTP on localhost, which Vigil
# allows.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  opensearch:
    http:
      # The name OpenSearch's demo certificate carries (a network alias), and
      # its root CA, copied out by ca.sh: the certificate is verified.
      endpoint: https://node-0.example.com:9200
      auth:
        authenticator: basicauth/opensearch
      tls:
        ca_file: /etc/otelcol/opensearch-ca.pem

extensions:
  # The image has no shell for a Compose health check: start.sh asks this
  # from the host.
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/opensearch:
    client_auth:
      username: admin
      password: ${env:OPENSEARCH_ADMIN_PASSWORD}

service:
  extensions: [health_check, basicauth/opensearch]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch]
