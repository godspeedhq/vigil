# Laid over Uptrace's own example (upstream/docker-compose.yml, fetched by
# start.sh at the pin in ../upstream.txt). The example publishes ClickHouse,
# Postgres and Uptrace on every interface, with its example passwords; here
# every port is on 127.0.0.1 only, as everywhere else in this environment,
# and ClickHouse and Postgres, which only Uptrace needs, are not published.

services:
  clickhouse:
    ports: !reset []
  postgres:
    ports: !reset []
  uptrace:
    ports: !override
      - "127.0.0.1:14317:4317"   # OTLP gRPC
      - "127.0.0.1:14318:80"     # UI and OTLP HTTP: Vigil sends here
