# vigil_tls: the test CA's certificate for Splunk's management API (8089),
# installed at start-up through SPLUNK_APPS_URL (see server.conf here, and
# compose.splunk.yaml). Not visible in Splunk Web.
[install]
state = enabled

[ui]
is_visible = false
label = Vigil test TLS

[launcher]
version = 1.0.0
description = The test CA's certificate for the management API
