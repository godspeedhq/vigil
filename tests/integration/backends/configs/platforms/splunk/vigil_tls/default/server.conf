# The management API (8089) serves the test CA's certificate for localhost
# and 127.0.0.1, instead of Splunk's self-signed one, so provision.sh and
# verify.sh verify it (curl --cacert .secrets/tls/ca.pem) rather than skip
# the check. splunk-server.pem is the certificate, its key and the CA in one
# file, as Splunk wants it; scripts/start.sh makes it from .secrets/tls. The
# key is a test key with no password.
#
# An app, not the image's default.yml "conf" entries: on every start after
# the first, the image's own setup cannot read the file those leave in
# system/local (Permission denied), and Splunk never starts again.
[sslConfig]
serverCert = /opt/vigil-tls/splunk-server.pem
sslRootCAPath = /opt/vigil-tls/ca.pem
