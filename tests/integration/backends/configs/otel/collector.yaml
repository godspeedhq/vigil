# The Grafana group's OpenTelemetry Collector (profile otel-collector): an
# intermediary. Vigil sends OTLP/HTTP to it on 24318; it forwards metrics
# to Mimir and logs to Loki, both as OTLP. Start it with mimir and loki,
# or with the grafana-stack profile.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlphttp/mimir:
    endpoint: http://mimir:9009/otlp
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/mimir, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, debug]
