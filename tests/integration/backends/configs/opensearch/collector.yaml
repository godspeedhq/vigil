# OTLP from Vigil, into OpenSearch through the collector's opensearch
# exporter. Inside the Compose network the collector talks to OpenSearch's
# demo certificate without checking it: this hop is test-only and never
# leaves the machine. Vigil's own hop to the collector is plain HTTP on
# localhost, which Vigil allows.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  opensearch:
    http:
      endpoint: https://opensearch:9200
      auth:
        authenticator: basicauth/opensearch
      tls:
        insecure_skip_verify: true

extensions:
  basicauth/opensearch:
    client_auth:
      username: admin
      password: ${env:OPENSEARCH_ADMIN_PASSWORD}

service:
  extensions: [basicauth/opensearch]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch]
