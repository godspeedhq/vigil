# nginx as an HTTPS source for Vigil's tests (compose.sources.yaml): the
# fixtures in .sources/https/ (written by provision.sh), with the test
# certificate on 9443, and plain http on 9080, which Vigil allows only to
# this host. For this test environment only.

events {}

http {
    access_log off;
    default_type application/octet-stream;

    # The authentication header: missing 401, wrong 403. The token's map
    # line is written by provision.sh; none at all leaves everything 403.
    map $http_x_vigil_token $vigil_auth {
        default 403;
        ""      401;
        include /srv/conf/*.map;
    }

    server {
        listen 9443 ssl;
        listen 9080;
        ssl_certificate     /tls/server.pem;
        ssl_certificate_key /tls/server-key.pem;
        root /srv;

        location = /healthz { return 200 "ok\n"; }
        # Scripts and configurations, as published.
        location /files/   { }
        location /configs/ { }
        # The same files, behind the header.
        location /auth/ {
            if ($vigil_auth = 401) { return 401; }
            if ($vigil_auth = 403) { return 403; }
            alias /srv/files/;
        }
        # Failures.
        location /forbidden/ { return 403; }
        location /broken/    { return 500; }
        location /busy/      { return 503; }
        location /moved/     { return 301 https://$host/files/; }
        # The connection closed without an answer.
        location /drop/      { return 444; }
        # One byte a second, so a fetch runs into its timeout.
        location /slow/ {
            limit_rate 1;
            alias /srv/files/;
        }
    }
}
