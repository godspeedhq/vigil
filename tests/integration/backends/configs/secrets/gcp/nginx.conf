# The TLS front of Floci's GCP emulator (compose.secrets.yaml): https on
# 4588 with the test certificate, passed on as plain http, for Secret
# Manager and the token endpoint alike. Vigil's stores, and a key's
# token_uri, are https only. For this test environment only.

events {}

http {
    access_log off;

    server {
        listen 4588 ssl;
        ssl_certificate     /tls/server.pem;
        ssl_certificate_key /tls/server-key.pem;

        location / {
            proxy_pass http://floci-gcp:4588;
            proxy_set_header Host $http_host;
        }
    }
}
