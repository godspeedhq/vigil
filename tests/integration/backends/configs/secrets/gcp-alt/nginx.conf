# The TLS front of Blackwell's Secret Manager emulator (compose.secrets.yaml):
# https on 4598 with the test certificate, passed on as plain http to its
# REST port. Vigil's stores are https only. For this test environment only.

events {}

http {
    access_log off;

    server {
        listen 4598 ssl;
        ssl_certificate     /tls/server.pem;
        ssl_certificate_key /tls/server-key.pem;

        location / {
            proxy_pass http://blackwell-gcp:8080;
            proxy_set_header Host $http_host;
        }
    }
}
