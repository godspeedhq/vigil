# The TLS front of Floci's AWS emulator (compose.secrets.yaml): https on
# 4566 with the test certificate, passed on as plain http. Vigil's stores
# are https only. For this test environment only.

events {}

http {
    access_log off;

    server {
        listen 4566 ssl;
        ssl_certificate     /tls/server.pem;
        ssl_certificate_key /tls/server-key.pem;

        location / {
            proxy_pass http://floci-aws:4566;
            # The host Vigil signed, as it signed it.
            proxy_set_header Host $http_host;
        }
    }
}
