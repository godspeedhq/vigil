# The TLS front of Floci's Azure emulator (compose.secrets.yaml): https on
# 4577 with the test certificate, passed on as plain http, for Key Vault and
# the emulated Entra ID's token endpoint alike. Vigil's stores are https
# only. For this test environment only.

events {}

http {
    access_log off;

    server {
        listen 4577 ssl;
        ssl_certificate     /tls/server.pem;
        ssl_certificate_key /tls/server-key.pem;

        location / {
            proxy_pass http://floci-az:4577;
            proxy_set_header Host $http_host;
        }
    }
}
