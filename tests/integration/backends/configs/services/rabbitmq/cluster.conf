# The rabbitmq pack's test cluster (compose.rabbitmq.yaml): its three nodes.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rmq-a
cluster_formation.classic_config.nodes.2 = rabbit@rmq-b
cluster_formation.classic_config.nodes.3 = rabbit@rmq-c
# The first node gives up waiting for the others soon (they start after it,
# and join it).
cluster_formation.discovery_retry_limit = 5
cluster_formation.discovery_retry_interval = 2000
