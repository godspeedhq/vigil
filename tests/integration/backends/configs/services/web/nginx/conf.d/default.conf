# Pages that answer 200, 404, 500 (PHP), 502 (nothing listening) and 504
# (no answer), PHP-FPM's status page, stub_status, and https with a
# certificate that expires in five days.
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /certs/soon.crt;
    ssl_certificate_key /certs/soon.key;
    location = /nginx_status { stub_status; }
    location ~ ^/fpm-(status|ping)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME $uri;
        fastcgi_param SCRIPT_FILENAME $uri;
        fastcgi_pass php86:9000;
    }
    location /php/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_read_timeout 60s;
        fastcgi_pass php86:9000;
    }
    location /refused/ { proxy_pass http://127.0.0.1:9/; }
    location /noanswer/ { proxy_pass http://10.255.255.1:81/; proxy_connect_timeout 1s; }
    location = /missing { return 404; }
    location / { return 200 "ok\n"; }
}
