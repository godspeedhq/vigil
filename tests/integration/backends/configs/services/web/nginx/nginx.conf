# The nginx the nginx pack is tested against (compose.web.yaml): two workers
# of 64 connections, the access log in the form the log job reads, with
# rt= and urt= at the end.
user nginx;
worker_processes 2;
pid /run/nginx.pid;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    log_format vigil '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log vigil;
    error_log /var/log/nginx/error.log warn;
    include /etc/nginx/conf.d/*.conf;
}
