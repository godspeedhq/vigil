# Added to the image's httpd.conf (compose.web.yaml): server-status with the
# totals, the access log in the form the log job reads (rtus= at the end),
# PHP and PHP-FPM's status pages through FastCGI, https with a certificate
# no CA signed, and few workers, so slow requests fill them.
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
ExtendedStatus On
<Location "/server-status">
    SetHandler server-status
</Location>
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" rtus=%D" vigil
CustomLog "/usr/local/apache2/logs/vigil_access.log" vigil
ProxyPassMatch "^/php/(.*\.php)$" "fcgi://php83:9000/var/www/html/php/$1"
ProxyPass "/fpm-status-api" "fcgi://php83:9001/fpm-status-api"
ProxyPass "/fpm-status" "fcgi://php83:9000/fpm-status"
Listen 443
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile "/certs/self.crt"
    SSLCertificateKeyFile "/certs/self.key"
</VirtualHost>
<IfModule mpm_event_module>
    ServerLimit 2
    ThreadsPerChild 10
    MaxRequestWorkers 20
</IfModule>
<IfModule mpm_prefork_module>
    StartServers 2
    MaxRequestWorkers 8
</IfModule>
