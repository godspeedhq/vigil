; PHP 8.3's www pool (compose.web.yaml): five workers, so its status page
; answers while slow requests run; requests over a second are slow.
[www]
pm = dynamic
pm.max_children = 5
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 1
pm.status_path = /fpm-status
ping.path = /fpm-ping
request_slowlog_timeout = 1s
slowlog = /proc/self/fd/2
