; PHP 8.6's www pool, as the phpfpm pack is tested (compose.web.yaml): two workers
; at most, so slow requests fill it; requests over a second are slow.
[www]
pm = dynamic
pm.max_children = 2
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 1
pm.status_path = /fpm-status
ping.path = /fpm-ping
request_slowlog_timeout = 1s
slowlog = /proc/self/fd/2
