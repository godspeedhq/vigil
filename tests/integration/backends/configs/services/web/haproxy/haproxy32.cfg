# The second HAProxy (3.2 LTS): its runtime API, and one backend.
global
    stats socket ipv4@0.0.0.0:9999 level user
defaults
    mode http
    timeout connect 1s
    timeout client 10s
    timeout server 10s
frontend fe_web
    bind :80
    default_backend be_web
backend be_web
    option httpchk GET /
    server nginx nginx:80 check inter 2s
    server gone 10.255.255.1:81 check inter 2s
