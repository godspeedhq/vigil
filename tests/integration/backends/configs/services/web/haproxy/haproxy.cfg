# HAProxy for the haproxy pack (compose.web.yaml): its runtime API at level
# user, on TCP and on a socket file; a backend of three good servers, one in
# maintenance and one draining; a backend whose servers never answer or
# refuse; one whose check gets a 404; one with a queue; and TLS.
global
    stats socket ipv4@0.0.0.0:9999 level user
    stats socket /var/run/haproxy/api.sock mode 666 level user
    maxconn 200
defaults
    mode http
    timeout connect 1s
    timeout client 30s
    timeout server 30s
    timeout queue 120s
frontend fe_web
    bind :80
    maxconn 50
    http-request deny if { path_beg /admin }
    use_backend be_dead if { path_beg /dead }
    use_backend be_queue if { path_beg /php/slow }
    default_backend be_web
frontend fe_tls
    bind :443 ssl crt /certs/haproxy.pem
    default_backend be_web
backend be_web
    option httpchk GET /
    server nginx nginx:80 check inter 2s
    server httpd httpd:80 check inter 2s
    server caddy caddy:80 check inter 2s
    server spare nginx:80 check disabled
    server old httpd:80 check weight 0
backend be_dead
    server gone 10.255.255.1:81 check inter 2s
    server refused nginx:81 check inter 2s
backend be_badcheck
    option httpchk GET /missing
    server nginx nginx:80 check inter 2s
backend be_queue
    server nginx nginx:80 maxconn 1
