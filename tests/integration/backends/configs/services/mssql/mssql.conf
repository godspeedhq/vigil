# SQL Server's settings for compose.mssql.yaml: TLS only, with the
# certificate in /tls; Always On availability groups; SQL Agent.

[network]
tlscert = /tls/server.crt
tlskey = /tls/server.key
tlsprotocols = 1.2
forceencryption = 1

[hadr]
hadrenabled = 1

[sqlagent]
enabled = true
