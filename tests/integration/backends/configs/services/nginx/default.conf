#
# The nginx the nginx pack reads: a page, and stub_status at /nginx_status.
# Published on 127.0.0.1 only (compose.services.yaml), so the status page is
# open inside the container.
server {
    listen 80;
    location = / { return 200 "vigil nginx pack test\n"; }
    location = /nginx_status { stub_status; }
}
