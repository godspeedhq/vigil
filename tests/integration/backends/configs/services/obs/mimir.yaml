# Mimir, one binary, for the mimir pack's test. A tenant may have 200 series
# in memory: Prometheus sends more, and the rest are discarded.
multitenancy_enabled: false
target: all

server:
  http_listen_port: 9009
  log_level: warn

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/common

blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /data/tsdb

ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory

store_gateway:
  sharding_ring:
    replication_factor: 1

compactor:
  data_dir: /data/compactor
  compaction_interval: 1m

limits:
  max_global_series_per_user: 200
