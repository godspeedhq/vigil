# Loki, one binary, for the loki pack's test. Old entries are rejected
# (reject_old_samples), lines over 256 bytes are discarded, and the rate is
# low enough for the test's burst to be limited.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 1h
  max_line_size: 256
  max_line_size_truncate: false
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 1
  retention_period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 1m
  retention_enabled: true
  delete_request_store: filesystem

ingester:
  chunk_idle_period: 30s
  max_chunk_age: 1m
  wal:
    flush_on_shutdown: true
