# The OpenTelemetry Collector, for the otelcol pack's test. What arrives on
# 4317 goes to Tempo, Loki, VictoriaLogs, VictoriaMetrics and Mimir (which
# refuses it: its tenant is at its series limit), and to an exporter nothing
# answers, whose small queue fills. What arrives on 4327 goes only to
# an exporter nothing answers, with no queue and no retry: its failure goes
# back to the receiver, which refuses the data.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  otlp/refused:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4327

processors:
  batch:
    timeout: 2s
  memory_limiter:
    check_interval: 1s
    limit_mib: 180

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlphttp/victorialogs:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
  otlphttp/victoriametrics:
    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
  otlphttp/dead:
    endpoint: http://alertmanager:9
    sending_queue:
      enabled: true
      queue_size: 10
      num_consumers: 1
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      max_interval: 10s
      max_elapsed_time: 60s
  otlphttp/refusing:
    endpoint: http://alertmanager:9
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false

service:
  telemetry:
    logs:
      level: error
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, otlphttp/dead]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki, otlphttp/victorialogs]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite/mimir, otlphttp/victoriametrics]
    traces/refused:
      receivers: [otlp/refused]
      exporters: [otlphttp/refusing]
