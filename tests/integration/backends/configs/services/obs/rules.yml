# Rules for the prometheus pack's test: one that records, one that always
# fires, one that is pending, and one that cannot be evaluated (every series
# it makes has the same labels).
groups:
  - name: good
    interval: 5s
    rules:
      - record: stack:up:count
        expr: count(up)
      - alert: AlwaysFiring
        expr: vector(1)
        labels:
          severity: page
        annotations:
          summary: fires on purpose
      - alert: TargetDown
        expr: up == 0
        for: 1h
        labels:
          severity: warn
  - name: broken
    interval: 5s
    rules:
      - record: stack:broken
        expr: label_replace(label_replace(up, "job", "x", "", ""), "instance", "y", "", "")
