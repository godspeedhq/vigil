# Grafana's data sources, for the grafana pack's test: three that answer,
# and one nothing listens to.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
  - name: Dead
    uid: dead
    type: prometheus
    access: proxy
    url: http://alertmanager:9
