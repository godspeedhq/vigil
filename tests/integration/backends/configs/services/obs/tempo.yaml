# Tempo 2.x, one binary, for the tempo pack's test. A trace may be 2 KB: the
# larger ones the test sends are discarded.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 5s
  max_block_duration: 1m
  flush_check_period: 5s

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    # The list of blocks is read again every 30 seconds (5 minutes by
    # default), so that the test need not wait for it.
    blocklist_poll: 30s
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    global:
      max_bytes_per_trace: 2000
