# Alertmanager, for the alertmanager pack's test: one receiver that answers
# and one nothing listens to, so that its notifications fail.
route:
  receiver: ok
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 30s
  routes:
    - matchers: ['severity="page"']
      receiver: dead
      continue: true
    - matchers: ['severity="page"']
      receiver: ok
receivers:
  - name: ok
    webhook_configs:
      - url: http://victorialogs:9428/insert/jsonline
        send_resolved: false
  - name: dead
    webhook_configs:
      - url: http://alertmanager:9/hook
        send_resolved: false
inhibit_rules:
  - source_matchers: ['severity="page"']
    target_matchers: ['severity="warn"']
    equal: ['instance']
