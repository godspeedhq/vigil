#
# The real-backend test environment (backlog task 18): one entry point for
# the nine groups, the ninth a secret store. Only Grafana LGTM has no profile, so
#
#   docker compose up -d
#
# starts LGTM and nothing else. Every other component has a profile of its
# own and starts only when asked for:
#
#   docker compose --profile prometheus up -d
#   docker compose --profile splunk up -d
#
# scripts/start.sh, stop.sh, reset.sh and verify.sh wrap this, one group or
# profile at a time; see README.md. Needs Docker Compose 2.20 or later, for
# include. Vigil itself runs on the host, never in a container.

name: vigil-backends

include:
  - compose.grafana.yaml
  - compose.splunk.yaml
  - compose.victoria.yaml
  - compose.elastic.yaml
  - compose.opensearch.yaml
  - compose.metrics.yaml
  - compose.tracing.yaml
  - compose.platforms.yaml
  - compose.secrets.yaml
