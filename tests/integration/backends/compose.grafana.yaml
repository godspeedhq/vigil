# Group 1: the Grafana ecosystem.
#
# lgtm is the default: one container with Grafana, Prometheus, Loki, Tempo,
# Pyroscope and an OpenTelemetry Collector, taking OTLP on 4317 and 4318.
# Vigil's otel backend and otel log destination send to it directly.
#
# The standalone components are profiles of their own. They duplicate what
# lgtm already holds, so start them instead of lgtm, not beside it:
#
#   docker compose --profile grafana-stack up -d     all of them
#   docker compose --profile prometheus up -d        one of them
#
# Ports are bound to 127.0.0.1 and chosen not to collide with lgtm's.

services:
  lgtm:
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "127.0.0.1:3000:3000"   # Grafana (admin / admin)
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP: Vigil sends here
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["prometheus", "grafana-stack"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # OTLP in at /api/v1/otlp/v1/metrics, which Vigil's otel backend uses.
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.5
    profiles: ["grafana", "grafana-stack"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  loki:
    image: grafana/loki:3.7.9
    profiles: ["loki", "grafana-stack"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:3100:3100"   # OTLP logs at /otlp/v1/logs
    volumes:
      - ./configs/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Pinned to 2.x: its single-binary configuration is the documented one.
  tempo:
    image: grafana/tempo:2.10.10
    profiles: ["tempo", "grafana-stack"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./configs/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  mimir:
    image: grafana/mimir:3.2.4
    profiles: ["mimir", "grafana-stack"]
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    ports:
      - "127.0.0.1:9009:9009"   # OTLP metrics at /otlp/v1/metrics
    volumes:
      - ./configs/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9009/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Profiles, which Vigil does not send: available, not applicable.
  pyroscope:
    image: grafana/pyroscope:2.4.2
    profiles: ["pyroscope", "grafana-stack"]
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - pyroscope-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4040/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # An intermediary: OTLP in, then Mimir for metrics and Loki for logs.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    profiles: ["otel-collector", "grafana-stack"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:24317:4317"
      - "127.0.0.1:24318:4318"   # Vigil sends here
    volumes:
      - ./configs/otel/collector.yaml:/etc/otelcol/config.yaml:ro

  # The same, through Alloy: metrics to Prometheus, logs to Loki.
  alloy:
    image: grafana/alloy:v1.21.3
    profiles: ["alloy", "grafana-stack"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "127.0.0.1:12345:12345"  # Alloy UI
      - "127.0.0.1:34318:4318"   # OTLP HTTP: Vigil sends here
    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro

volumes:
  lgtm-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  mimir-data:
  pyroscope-data:
