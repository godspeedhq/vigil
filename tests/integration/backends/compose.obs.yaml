# A monitoring stack for the nine packs that watch one (scripts/run-obs.sh):
# prometheus, alertmanager, grafana, loki, mimir, tempo, otelcol,
# victoriametrics and victorialogs. They are wired together as they are in
# use, and each is in trouble on purpose (configs/services/obs says how):
#
#   Prometheus       two targets down and one that answers without metrics, a
#                    rule that cannot be evaluated, an Alertmanager that is
#                    not there, and a remote write nothing answers
#   Alertmanager     two in a cluster; a receiver nothing listens to
#   Grafana          a data source nothing answers, an alert rule that reads
#                    it, and a contact point nothing listens to
#   Loki             entries too old, lines too long, and a rate limit
#   Mimir            a limit of 200 series for its one tenant
#   Tempo            traces larger than its limit
#   the Collector    an exporter nothing answers (its queue fills), and a
#                    pipeline whose receiver must refuse what it is sent
#   VictoriaMetrics  a scrape target that is down, and queries that fail
#   VictoriaLogs     entries older than its retention
#
# Everything listens on 127.0.0.1 only, on ports of its own (190xx, 184xx,
# 188xx), so it runs beside the delivery tests' own Prometheus, Loki and
# Grafana. Memory is capped: the test machine has 8 GB for all.

x-gen: &gen
  image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.166.0
  mem_limit: 96m
  restart: unless-stopped
  depends_on: [otelcol]

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    ports: ["127.0.0.1:19090:9090"]
    volumes:
      - ./configs/services/obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./configs/services/obs/rules.yml:/etc/prometheus/rules.yml:ro,z

  alertmanager:
    image: prom/alertmanager:v0.35.1
    mem_limit: 128m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=0.0.0.0:9094
      - --cluster.peer=alertmanager2:9094
    ports: ["127.0.0.1:19093:9093"]
    volumes:
      - ./configs/services/obs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z

  alertmanager2:
    image: prom/alertmanager:v0.35.1
    mem_limit: 128m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=0.0.0.0:9094
      - --cluster.peer=alertmanager:9094
    ports: ["127.0.0.1:19094:9093"]
    volumes:
      - ./configs/services/obs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.157.0
    mem_limit: 384m
    command:
      - -retentionPeriod=1d
      - -promscrape.config=/etc/vmscrape.yml
      - -search.maxQueryDuration=5s
    ports: ["127.0.0.1:18428:8428"]
    volumes:
      - ./configs/services/obs/vmscrape.yml:/etc/vmscrape.yml:ro,z

  victorialogs:
    image: victoriametrics/victoria-logs:v1.54.0
    mem_limit: 256m
    command:
      - -retentionPeriod=1d
    ports: ["127.0.0.1:19428:9428"]

  loki:
    image: grafana/loki:3.7.9
    mem_limit: 512m
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports: ["127.0.0.1:19310:3100"]
    volumes:
      - ./configs/services/obs/loki.yaml:/etc/loki/loki.yaml:ro,z

  mimir:
    image: grafana/mimir:3.2.6
    mem_limit: 768m
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    ports: ["127.0.0.1:19009:9009"]
    volumes:
      - ./configs/services/obs/mimir.yaml:/etc/mimir/mimir.yaml:ro,z
      - mimir-data:/data

  tempo:
    image: grafana/tempo:2.10.10
    mem_limit: 512m
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports: ["127.0.0.1:19320:3200"]
    volumes:
      - ./configs/services/obs/tempo.yaml:/etc/tempo/tempo.yaml:ro,z
      - tempo-data:/var/tempo

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.166.0
    mem_limit: 256m
    command: ["--config=/etc/otelcol/config.yaml"]
    ports: ["127.0.0.1:18888:8888"]
    volumes:
      - ./configs/services/obs/otelcol.yaml:/etc/otelcol/config.yaml:ro,z

  grafana:
    image: grafana/grafana:13.2.5
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${OBS_GRAFANA_PASSWORD:?the admin password of the test Grafana}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_LOG_LEVEL: warn
    ports: ["127.0.0.1:19300:3000"]
    volumes:
      - ./configs/services/obs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro,z
      - ./configs/services/obs/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro,z

  # What flows through: traces, logs and metrics to the Collector; traces
  # too large for Tempo; and traces to the pipeline that must refuse them.
  gen-traces:
    <<: *gen
    command: ["traces", "--otlp-endpoint", "otelcol:4317", "--otlp-insecure", "--rate", "4", "--duration", "24h"]
  gen-logs:
    <<: *gen
    command: ["logs", "--otlp-endpoint", "otelcol:4317", "--otlp-insecure", "--rate", "4", "--duration", "24h"]
  gen-metrics:
    <<: *gen
    command: ["metrics", "--otlp-endpoint", "otelcol:4317", "--otlp-insecure", "--rate", "2", "--duration", "24h"]
  gen-large:
    <<: *gen
    command: ["traces", "--otlp-endpoint", "otelcol:4317", "--otlp-insecure", "--rate", "1", "--child-spans", "40", "--duration", "24h"]
  gen-refused:
    <<: *gen
    command: ["traces", "--otlp-endpoint", "otelcol:4327", "--otlp-insecure", "--rate", "2", "--duration", "24h"]

  # Logs pushed straight to Loki and VictoriaLogs (good, too old, too long),
  # and queries, good and bad, to everything that answers them.
  load:
    image: curlimages/curl:8.17.0
    mem_limit: 48m
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/load.sh"]
    volumes:
      - ./configs/services/obs/load.sh:/load.sh:ro,z

volumes:
  mimir-data:
  tempo-data:
