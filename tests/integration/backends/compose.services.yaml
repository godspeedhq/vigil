#
# The services the service packs (packs/postgres, packs/nginx) monitor, for
# scripts/run-pack.sh. Not somewhere Vigil sends: what its packs read.
#
#   postgres-pack   PostgreSQL 18 on 15432, with vigil_monitor, a read-only
#                   role (pg_monitor), made at its first start
#   nginx-pack      nginx with stub_status at /nginx_status, on 9082
#
# Passwords from .env: POSTGRES_PASSWORD (the server's superuser, for the
# test's own setup) and POSTGRES_MONITOR_PASSWORD (the pack's role).

services:
  postgres-pack:
    image: postgres:18.1-alpine
    profiles: ["postgres-pack"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:-}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./configs/services/postgres/monitor-role.sh:/docker-entrypoint-initdb.d/monitor-role.sh:ro,z
      - postgres-pack-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  nginx-pack:
    image: nginx:1.30.5-alpine
    profiles: ["nginx-pack"]
    ports:
      - "127.0.0.1:9082:80"
    volumes:
      - ./configs/services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx_status > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-pack-data:
