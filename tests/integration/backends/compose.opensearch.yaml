#
# Group 5: OpenSearch and OpenSearch Dashboards, single node, with the
# security plugin on (its demo certificates, admin password from .env).
#
#   docker compose --profile opensearch up -d
#
# Vigil has no native OpenSearch backend yet, so its OTLP goes through an
# OpenTelemetry Collector (opensearch-collector, on 4428) and the
# collector's opensearch exporter: integration through an intermediary.
#
# Apache License 2.0. Wants 2 GB of memory or more, and on Linux
# vm.max_map_count of at least 262144. Published on other ports than the
# Elastic group's, so the two can run together.

services:
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    profiles: ["opensearch"]
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-}
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9201:9200"   # HTTPS, the demo certificate: verify with .secrets/opensearch/root-ca.pem
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    # The name the demo certificate carries, so the collector and Dashboards
    # can verify it.
    networks:
      default:
        aliases: [node-0.example.com]
    healthcheck:
      # Verified against the container's own demo root CA: the certificate
      # names localhost.
      test: ["CMD-SHELL", "curl -fsS --cacert /usr/share/opensearch/config/root-ca.pem -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    profiles: ["opensearch"]
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["https://node-0.example.com:9200"]'
      # The image's own setting is verificationMode none.
      OPENSEARCH_SSL_VERIFICATIONMODE: full
      OPENSEARCH_SSL_CERTIFICATEAUTHORITIES: '["/usr/share/opensearch-dashboards/config/root-ca.pem"]'
    ports:
      - "127.0.0.1:5602:5601"
    volumes:
      # Copied out of the opensearch container by configs/platforms/opensearch/ca.sh.
      - ./.secrets/opensearch/root-ca.pem:/usr/share/opensearch-dashboards/config/root-ca.pem:ro,z

  opensearch-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    profiles: ["opensearch"]
    depends_on:
      opensearch:
        condition: service_healthy
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OPENSEARCH_ADMIN_PASSWORD: ${OPENSEARCH_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:4428:4318"   # OTLP HTTP: Vigil sends here
      - "127.0.0.1:13136:13133"  # health_check: start.sh waits for it
    volumes:
      - ./configs/platforms/opensearch/collector.yaml:/etc/otelcol/config.yaml:ro,z
      - ./.secrets/opensearch/root-ca.pem:/etc/otelcol/opensearch-ca.pem:ro,z

volumes:
  opensearch-data:
