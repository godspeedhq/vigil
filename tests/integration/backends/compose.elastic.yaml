#
# Group 4: Elasticsearch and Kibana, single node, with security on.
#
#   docker compose --profile elastic up -d
#
# Vigil has no native Elasticsearch backend yet, so its OTLP goes through an
# OpenTelemetry Collector (elastic-collector, on 4418) and the collector's
# elasticsearch exporter: integration through an intermediary.
#
# Runs under the Elastic License 2.0 with the free Basic features; nothing
# needs accepting. Wants 2 GB of memory or more, and on Linux
# vm.max_map_count of at least 262144 (sysctl -w vm.max_map_count=262144).
# Plain HTTP inside, published on 127.0.0.1 only.

services:
  elasticsearch:
    image: elasticsearch:9.5.5
    profiles: ["elastic"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  # One-shot: gives the kibana_system user the password Kibana logs in with,
  # as Elastic's own Compose example does.
  elastic-setup:
    image: elasticsearch:9.5.5
    profiles: ["elastic"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:-}
    entrypoint: ["bash", "-c"]
    command:
      - >-
        until curl -fsS -u "elastic:$$ELASTIC_PASSWORD" -H 'Content-Type: application/json'
        http://elasticsearch:9200/_security/user/kibana_system/_password
        -d "{\"password\":\"$$KIBANA_PASSWORD\"}"; do sleep 5; done
    restart: "no"

  kibana:
    image: kibana:9.5.5
    profiles: ["elastic"]
    depends_on:
      elastic-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-}
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  elastic-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    profiles: ["elastic"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
    ports:
      - "127.0.0.1:4418:4318"   # OTLP HTTP: Vigil sends here
      - "127.0.0.1:13135:13133"  # health_check: start.sh waits for it
    volumes:
      - ./configs/platforms/elastic/collector.yaml:/etc/otelcol/config.yaml:ro,z

volumes:
  elasticsearch-data:
