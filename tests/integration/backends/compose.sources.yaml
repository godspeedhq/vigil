#
# Group 10: sources, the servers Vigil fetches its configuration and scripts
# from (backlog task 25; spec 6.8, 6.9, 16.5). Each has its own profile,
# and none starts unless asked for:
#
#   scripts/start.sh git-gitea       Gitea: Git over HTTPS and SSH
#   scripts/start.sh https-nginx     nginx: an HTTPS file server
#   scripts/start.sh sftp-openssh    OpenSSH: SFTP
#
# Each uses the test CA of the secret stores (configs/secrets/tls.sh), and
# keys and fixtures that configs/sources/<server>/provision.sh makes, in
# .sources/ (git-ignored). The fixtures are fixed files in fixtures/sources/,
# so their content and SHA-256 are known. Vigil runs on the host, never in a
# container (scripts/run-source.sh).
#
# Licences: Gitea MIT; nginx BSD-2-Clause; atmoz/sftp MIT (OpenSSH, BSD).

services:
  # Gitea, with its own TLS (the test certificate) on 3443, and its built-in
  # SSH server on 2222.
  gitea:
    image: gitea/gitea:28.2.0
    profiles: ["git-gitea"]
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__PROTOCOL: https
      GITEA__server__HTTP_PORT: "3443"
      GITEA__server__ROOT_URL: https://127.0.0.1:3443/
      GITEA__server__CERT_FILE: /tls/server.pem
      GITEA__server__KEY_FILE: /tls/server-key.pem
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__server__SSH_LISTEN_PORT: "2222"
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__SSH_DOMAIN: 127.0.0.1
      GITEA__server__DISABLE_SSH: "false"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__log__LEVEL: warn
    ports:
      - "127.0.0.1:3443:3443"
      - "127.0.0.1:2222:2222"
    volumes:
      - gitea-data:/data
      - ./.secrets/tls:/tls:ro,z
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://127.0.0.1:3443/api/healthz > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  # nginx: the fixtures in .sources/https/, https on 9443 (the test
  # certificate) and plain http on 9080, with endpoints that fail on purpose.
  nginx-sources:
    image: nginx:1.30.5-alpine
    profiles: ["https-nginx"]
    ports:
      - "127.0.0.1:9443:9443"
      - "127.0.0.1:9080:9080"
    volumes:
      - ./configs/sources/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./.secrets/tls:/tls:ro,z
      - ./.sources/https:/srv:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # OpenSSH SFTP (atmoz/sftp, pinned by digest: it only has rolling tags):
  # user vigil (uid 2001, not a test account's own, so files those accounts
  # keep 0600 are off limits to it), key only, chrooted, with .sources/sftp/files as
  # /files, read-only. Its host key is fixed (.sources/ssh/sftp_host_ed25519)
  # so known_hosts stays right across restarts.
  sftp-openssh:
    image: atmoz/sftp:alpine@sha256:43dd1c023cf1bae487127d4b54660b0aee6e94c188a6599be36fb89ba115f961
    profiles: ["sftp-openssh"]
    command: ["vigil::2001"]
    ports:
      - "127.0.0.1:2022:22"
    volumes:
      - ./.sources/ssh/vigil_sources.pub:/home/vigil/.ssh/keys/vigil_sources.pub:ro,z
      - ./.sources/ssh/sftp_host_ed25519:/etc/ssh/ssh_host_ed25519_key:ro,z
      - ./.sources/sftp/files:/home/vigil/files:ro,z

volumes:
  gitea-data:
