# broker.properties - an Artemis broker (2.x) for the artemis pack's tests
# (scripts/run-artemis.sh), small on purpose so trouble comes quickly: 32 MB
# for every address, 1 MB for orders (then it pages to disk) and for blocked
# (then producers are blocked), expiry checked every 5 seconds.
globalMaxSize=33554432
messageExpiryScanPeriod=5000
addressSettings."orders".maxSizeBytes=1048576
addressSettings."orders".addressFullMessagePolicy=PAGE
addressSettings."blocked".maxSizeBytes=1048576
addressSettings."blocked".addressFullMessagePolicy=BLOCK
