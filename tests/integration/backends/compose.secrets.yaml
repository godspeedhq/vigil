#
# Group 9: a secret store, OpenBao 2.7.1, the open-source fork of HashiCorp
# Vault, to prove Vigil's hashicorp_vault store: KV version 2, signing in
# with AppRole or a token, over TLS.
#
#   docker compose --profile openbao up -d     (scripts/start.sh openbao)
#
# Dev mode: in memory and unsealed. Every start makes a new CA and a
# certificate for localhost and 127.0.0.1, and takes its root token from
# .env. Nothing survives a stop, so configs/openbao/provision.sh, which
# start.sh runs, sets it all up again. Vigil's secret stores are https only,
# so Vigil reaches it at https://127.0.0.1:8200, trusting the CA that
# provision.sh copies out.
#
# MPL-2.0 licence.

services:
  openbao:
    image: openbao/openbao:2.7.1
    profiles: ["openbao"]
    command: ["server", "-dev", "-dev-tls", "-dev-tls-cert-dir=/openbao/tls", "-dev-no-store-token"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_ROOT_TOKEN:-}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # Dev mode keeps everything in memory; no mlock needed.
      SKIP_SETCAP: "true"
    ports:
      - "127.0.0.1:8200:8200"
    # The generated CA, certificate and key: in memory, gone at the stop.
    tmpfs:
      - /openbao/tls:uid=100,gid=1000,mode=0750
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/tls/vault-ca.pem bao status > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
