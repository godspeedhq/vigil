#
# Group 9: secret stores, to test the stores Vigil already has (backlog
# task 24). Each service has its own profile, and none starts unless asked
# for:
#
#   scripts/start.sh openbao      OpenBao, the open-source fork of Vault
#   scripts/start.sh vault        HashiCorp Vault
#
# Both are real servers, not dev mode, so they survive a restart, which the
# tests use:
#   - integrated storage (raft, one node) on a named volume
#   - TLS from a test CA that configs/secrets/tls.sh makes once, before the
#     first start, in .secrets/ (git-ignored)
#   - initialised once, then unsealed after every start, by
#     configs/secrets/provision.sh, which also sets up the fixtures
#
# start.sh runs both scripts. Vigil's secret stores are https only, and the
# certificate is for localhost and 127.0.0.1. Cloud emulators (AWS, Azure,
# GCP) are phase 2 of task 24.
#
# Licences: OpenBao MPL 2.0; Vault BUSL 1.1, which allows this local
# testing.

services:
  openbao:
    image: openbao/openbao:2.7.1
    profiles: ["openbao"]
    # The entrypoint adds -config=/openbao/config.
    command: ["server"]
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - openbao-data:/openbao/file
      - ./configs/secrets/openbao/server.hcl:/openbao/config/server.hcl:ro,z
      - ./.secrets/tls:/tls:ro,z
    healthcheck:
      # Answering is enough: sealed (exit 2) is how every start begins.
      test: ["CMD-SHELL", "BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/tls/ca.pem bao status > /dev/null; [ $$? -ne 1 ]"]
      interval: 5s
      timeout: 5s
      retries: 30

  vault:
    image: hashicorp/vault:2.2.0
    profiles: ["vault"]
    # The entrypoint adds -config=/vault/config.
    command: ["server"]
    environment:
      # File storage keeps nothing in locked memory worth protecting here.
      SKIP_SETCAP: "true"
    ports:
      - "127.0.0.1:8210:8200"
    volumes:
      - vault-data:/vault/file
      - ./configs/secrets/vault/server.hcl:/vault/config/server.hcl:ro,z
      - ./.secrets/tls:/tls:ro,z
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=https://127.0.0.1:8200 VAULT_CACERT=/tls/ca.pem vault status > /dev/null; [ $$? -ne 1 ]"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  openbao-data:
  vault-data:
