#
# Group 9: secret stores, to test the stores Vigil already has (backlog
# task 24). Each service has its own profile, and none starts unless asked
# for:
#
#   scripts/start.sh openbao      OpenBao, the open-source fork of Vault
#   scripts/start.sh vault        HashiCorp Vault
#   scripts/start.sh aws          Floci's AWS emulator, Secrets Manager
#   scripts/start.sh azure        Floci's Azure emulator, Key Vault
#   scripts/start.sh gcp          Floci's GCP emulator, Secret Manager
#   scripts/start.sh azure-alt    Lowkey Vault, a Key Vault emulator
#
# OpenBao and Vault are real servers, not dev mode, so they survive a
# restart, which the tests use:
#   - integrated storage (raft, one node) on a named volume
#   - TLS from a test CA that configs/secrets/tls.sh makes once, before the
#     first start, in .secrets/ (git-ignored)
#   - initialised once, then unsealed after every start, by
#     configs/secrets/provision.sh, which also sets up the fixtures
#
# start.sh runs both scripts. Vigil's secret stores are https only, and the
# certificate is for localhost and 127.0.0.1.
#
# The cloud emulators keep everything in memory: configs/secrets/<cloud>/
# provision.sh writes their fixtures again after every start. One that
# speaks only plain http sits behind a small nginx with the same test
# certificate, its only published port; that is test plumbing, not a change
# to Vigil.
#
# Licences: OpenBao MPL 2.0; Vault BUSL 1.1, which allows this local
# testing; Floci MIT; nginx BSD-2-Clause; Lowkey Vault MIT.

services:
  openbao:
    image: openbao/openbao:2.7.1
    profiles: ["openbao"]
    # The entrypoint adds -config=/openbao/config.
    command: ["server"]
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - openbao-data:/openbao/file
      - ./configs/secrets/openbao/server.hcl:/openbao/config/server.hcl:ro,z
      - ./.secrets/tls:/tls:ro,z
    healthcheck:
      # Answering is enough: sealed (exit 2) is how every start begins.
      test: ["CMD-SHELL", "BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/tls/ca.pem bao status > /dev/null; [ $$? -ne 1 ]"]
      interval: 5s
      timeout: 5s
      retries: 30

  vault:
    image: hashicorp/vault:2.2.0
    profiles: ["vault"]
    # The entrypoint adds -config=/vault/config.
    command: ["server"]
    environment:
      # File storage keeps nothing in locked memory worth protecting here.
      SKIP_SETCAP: "true"
    ports:
      - "127.0.0.1:8210:8200"
    volumes:
      - vault-data:/vault/file
      - ./configs/secrets/vault/server.hcl:/vault/config/server.hcl:ro,z
      - ./.secrets/tls:/tls:ro,z
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=https://127.0.0.1:8200 VAULT_CACERT=/tls/ca.pem vault status > /dev/null; [ $$? -ne 1 ]"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Floci's AWS emulator: Secrets Manager, plain http, any credentials.
  floci-aws:
    image: floci/floci:2.3.0
    profiles: ["aws"]
    expose:
      - "4566"

  floci-aws-tls:
    image: nginx:1.30.5-alpine
    profiles: ["aws"]
    depends_on:
      - floci-aws
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./configs/secrets/aws/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./.secrets/tls:/tls:ro,z
    healthcheck:
      # Floci answering, whatever it says (BusyBox wget, plain http inside).
      test: ["CMD-SHELL", "wget -S -O /dev/null http://floci-aws:4566/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Floci's Azure emulator: Key Vault, and an emulated Entra ID that issues
  # client_credentials tokens. Plain http; any token and client secret are
  # accepted. 4578 is its plain-http port, published only for the managed
  # identity endpoint, which run-store reaches through Vigil's test switch
  # VIGIL_TEST_IMDS (spec 22.4.2): Azure's own is plain http too.
  floci-az:
    image: floci/floci-az:0.15.0
    profiles: ["azure"]
    ports:
      - "127.0.0.1:4578:4577"

  floci-az-tls:
    image: nginx:1.30.5-alpine
    profiles: ["azure"]
    depends_on:
      - floci-az
    ports:
      - "127.0.0.1:4577:4577"
    volumes:
      - ./configs/secrets/azure/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./.secrets/tls:/tls:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://floci-az:4577/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Floci's GCP emulator: Secret Manager over REST, and an OAuth2 token
  # endpoint (/token) that answers the JWT-bearer grant Vigil's
  # service_account_key sends. Plain http; any assertion is accepted; no
  # metadata server.
  floci-gcp:
    image: floci/floci-gcp:0.11.0
    profiles: ["gcp"]
    expose:
      - "4588"

  floci-gcp-tls:
    image: nginx:1.30.5-alpine
    profiles: ["gcp"]
    depends_on:
      - floci-gcp
    ports:
      - "127.0.0.1:4588:4588"
    volumes:
      - ./configs/secrets/gcp/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./.secrets/tls:/tls:ro,z
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://floci-gcp:4588/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Lowkey Vault, a community Key Vault emulator. It tells its vaults apart
  # by Host and port, so it is published on 8443 itself and serves TLS with
  # the test certificate (as PKCS#12), rather than behind a front. 8081 is
  # its plain-http managed identity endpoint, which run-store reaches through
  # Vigil's test switch VIGIL_TEST_IMDS (spec 22.4.2); it has no
  # client-credentials endpoint. Any bearer token is accepted.
  lowkey-vault:
    image: nagyesta/lowkey-vault:7.3.127
    profiles: ["azure-alt"]
    environment:
      LOWKEY_ARGS: >-
        --server.ssl.key-store=/tls/server.p12 --server.ssl.key-store-type=PKCS12
        --server.ssl.key-store-password=vigil-test --server.ssl.key-alias=lowkey-vault
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8081:8080"
    volumes:
      - ./.secrets/tls:/tls:ro,z

volumes:
  openbao-data:
  vault-data:
