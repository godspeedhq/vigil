# Traefik for the traefik pack (scripts/run-traefik.sh): 3.8 and 3.7, side by
# side, each reading the same dynamic configuration, which the run script
# writes into TRAEFIK_DYN (and TRAEFIK_CERTS, its certificates). Each serves
# its metrics, its API and /ping on the traefik entrypoint:
# - t38: Traefik 3.8, API and metrics on 127.0.0.1:18080, web on 18081,
#   websecure on 18443.
# - t37: Traefik 3.7, API and metrics on 127.0.0.1:18090, web on 18091,
#   websecure on 18453.
# Two whoami backends, w1 and w2; the run stops w2 on purpose.

x-traefik: &traefik
  mem_limit: 256m
  command: [--api=true, --api.insecure=true, --ping=true, --metrics.prometheus=true,
    --metrics.prometheus.addRoutersLabels=true, --metrics.prometheus.addServicesLabels=true,
    --entryPoints.web.address=:80, --entryPoints.websecure.address=:443,
    --providers.file.directory=/dyn, --providers.file.watch=true, --log.level=INFO]
  volumes: ["${TRAEFIK_DYN:?the dynamic configuration}:/dyn:ro,z", "${TRAEFIK_CERTS:?the certificates}:/certs:ro,z"]

services:
  t38:
    <<: *traefik
    image: traefik:${TRAEFIK_VERSION:-v3.8.0}
    ports: ["127.0.0.1:18080:8080", "127.0.0.1:18081:80", "127.0.0.1:18443:443"]
  t37:
    <<: *traefik
    image: traefik:${TRAEFIK37_VERSION:-v3.7.20}
    ports: ["127.0.0.1:18090:8080", "127.0.0.1:18091:80", "127.0.0.1:18453:443"]
  w1: {image: "traefik/whoami:v1.12.0", mem_limit: 64m}
  w2: {image: "traefik/whoami:v1.12.0", mem_limit: 64m}
