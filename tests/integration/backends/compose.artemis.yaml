# Artemis brokers for the artemis pack (scripts/run-artemis.sh), each with
# workloads/artemis's broker.properties and the JVM's JMX over TLS (the
# registry too), logging in as the broker's users (login.config=activemq:
# its JAAS realm), each checked against management.xml's roles. Artemis's
# own connector (management.xml's <connector>) does not put its registry
# on TLS. Not somewhere Vigil sends: what its pack reads.
#
#   art233   Artemis 2.33   JMX 19331
#   art240   Artemis 2.40   JMX 19332
#   art244   Artemis 2.44   JMX 19333
#
# Each broker's etc-override comes from ARTEMIS_ETC_DIR/<name>: its
# management.xml, users (admin, and monitor of role view) and roles, as
# run-artemis.sh writes them; its TLS certificate from ARTEMIS_TLS_DIR
# (server.p12, its password in ARTEMIS_KS_PASSWORD). Each takes 512 MB.

x-artemis: &artemis
  mem_limit: 512m

x-jmx: &jmx >-
  -Xms128m -Xmx320m -Djava.rmi.server.hostname=localhost
  -Dcom.sun.management.jmxremote.authenticate=true -Dcom.sun.management.jmxremote.login.config=activemq
  -Dcom.sun.management.jmxremote.ssl=true -Dcom.sun.management.jmxremote.registry.ssl=true
  -Djavax.net.ssl.keyStore=/tls/server.p12 -Djavax.net.ssl.keyStoreType=PKCS12
  -Djavax.net.ssl.keyStorePassword=${ARTEMIS_KS_PASSWORD:-}

services:
  art233:
    <<: *artemis
    image: apache/activemq-artemis:2.33.0
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: ${ARTEMIS_ADMIN_PASSWORD:-}
      JMX_OPTS: *jmx
      JAVA_ARGS_APPEND: -Dcom.sun.management.jmxremote.port=19331 -Dcom.sun.management.jmxremote.rmi.port=19331
    entrypoint: ["/bin/sh", "-c", "JAVA_ARGS_APPEND=\"$$JAVA_ARGS_APPEND $$JMX_OPTS\" exec /docker-run.sh run"]
    volumes:
      - ${ARTEMIS_ETC_DIR:-./.artemis-etc}/art233:/var/lib/artemis-instance/etc-override:ro,z
      - ${ARTEMIS_TLS_DIR:-./.artemis-tls}:/tls:ro,z
    ports:
      - "127.0.0.1:19331:19331"

  art240:
    <<: *artemis
    image: apache/activemq-artemis:2.40.0
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: ${ARTEMIS_ADMIN_PASSWORD:-}
      JMX_OPTS: *jmx
      JAVA_ARGS_APPEND: -Dcom.sun.management.jmxremote.port=19332 -Dcom.sun.management.jmxremote.rmi.port=19332
    entrypoint: ["/bin/sh", "-c", "JAVA_ARGS_APPEND=\"$$JAVA_ARGS_APPEND $$JMX_OPTS\" exec /docker-run.sh run"]
    volumes:
      - ${ARTEMIS_ETC_DIR:-./.artemis-etc}/art240:/var/lib/artemis-instance/etc-override:ro,z
      - ${ARTEMIS_TLS_DIR:-./.artemis-tls}:/tls:ro,z
    ports:
      - "127.0.0.1:19332:19332"

  art244:
    <<: *artemis
    image: apache/activemq-artemis:2.44.0
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: ${ARTEMIS_ADMIN_PASSWORD:-}
      JMX_OPTS: *jmx
      JAVA_ARGS_APPEND: -Dcom.sun.management.jmxremote.port=19333 -Dcom.sun.management.jmxremote.rmi.port=19333
    entrypoint: ["/bin/sh", "-c", "JAVA_ARGS_APPEND=\"$$JAVA_ARGS_APPEND $$JMX_OPTS\" exec /docker-run.sh run"]
    volumes:
      - ${ARTEMIS_ETC_DIR:-./.artemis-etc}/art244:/var/lib/artemis-instance/etc-override:ro,z
      - ${ARTEMIS_TLS_DIR:-./.artemis-tls}:/tls:ro,z
    ports:
      - "127.0.0.1:19333:19333"
