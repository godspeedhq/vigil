;
; supervisord for a fleet test instance: keeps `vigil supervise` running as
; the vigil user, its output in the container's log.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:vigil]
command=/home/vigil/vigil/app/vigil --root /home/vigil/vigil supervise
user=vigil
environment=HOME="/home/vigil"
autostart=true
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
