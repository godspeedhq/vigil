# The fleet of backlog 31 (SPECIFICATION.md 18.11): servers for three of
# the four source types, and seven hosts that each follow one of them.
# Everything the run makes (releases, keys, the CA, the sources' files) is
# in ./share, mounted read-only into every host at /fleet. Published ports
# bind 127.0.0.1 only: the Mac and Windows hosts reach them through SSH
# tunnels. Started and driven by fleet.sh.
name: vigil-fleet

x-host: &host
  build: ./host
  init: true
  networks: [fleet]
  volumes: ["./share:/fleet:ro"]
  depends_on: [fleet-git, fleet-sftp, fleet-https]

services:
  fleet-git:
    build: ./ssh
    environment: { SSH_USER: git }
    networks: [fleet]
    ports: ["127.0.0.1:2222:22"]
    volumes: ["./share:/fleet:ro", "./data/git/fleet.git:/home/git/fleet.git:ro"]

  fleet-sftp:
    build: ./ssh
    environment: { SSH_USER: files }
    networks: [fleet]
    ports: ["127.0.0.1:2223:22"]
    volumes: ["./share:/fleet:ro", "./data/sftp:/home/files/fleet:ro"]

  fleet-https:
    image: nginx:stable
    networks: [fleet]
    ports: ["127.0.0.1:8443:443", "127.0.0.1:8080:80"]
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./share/ca:/fleet/ca:ro"
      - "./data/https:/usr/share/nginx/html/fleet:ro"

  h1:
    <<: *host
    hostname: h1
    environment: { FLEET_SOURCE: git, FLEET_FILE: hosts/h1.config, FLEET_START: 99.1.0 }
  h2:
    <<: *host
    hostname: h2
    environment: { FLEET_SOURCE: git, FLEET_FILE: groups/git.config, FLEET_START: 99.1.0 }
  h3:
    <<: *host
    hostname: h3
    environment: { FLEET_SOURCE: https, FLEET_FILE: groups/https.config, FLEET_START: 99.1.0 }
  h4:
    <<: *host
    hostname: h4
    environment: { FLEET_SOURCE: https, FLEET_FILE: groups/https.config, FLEET_START: 99.1.0 }
  h5:
    <<: *host
    hostname: h5
    environment: { FLEET_SOURCE: sftp, FLEET_FILE: groups/sftp.config, FLEET_START: 99.1.0 }
  h6:
    <<: *host
    hostname: h6
    environment: { FLEET_SOURCE: sftp, FLEET_FILE: groups/sftp.config, FLEET_START: 99.1.0 }
  h7:
    <<: *host
    hostname: h7
    environment: { FLEET_SOURCE: local, FLEET_FILE: groups/local.config, FLEET_START: 99.1.0 }

networks:
  fleet: {}
