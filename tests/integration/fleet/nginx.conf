# The https source: TLS with a certificate from the run's CA for the name
# the hosts use, and the same files over plain HTTP on port 80 for the Mac
# and Windows hosts, which reach it through a tunnel as 127.0.0.1 (the one
# address Vigil allows plain HTTP to).
server {
    listen 443 ssl;
    server_name fleet-https;
    ssl_certificate     /fleet/ca/https.pem;
    ssl_certificate_key /fleet/ca/https.key;
    root /usr/share/nginx/html;
}
server {
    listen 80;
    root /usr/share/nginx/html;
}
