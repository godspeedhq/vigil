name: spike
on:
  push:
    branches: [fix/intermittent-tests]
jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-latest, macos-latest, ubuntu-latest]
        n: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          for i in 1 2 3 4; do
            /bin/bash tests/integration/upgrade.sh | grep -E '  FAIL  |^        |passed, ' || true
            /bin/bash tests/integration/self-update.sh | grep -E '  FAIL  |^        |passed, ' || true
          done
  win:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - run: |
          foreach ($i in 1..3) {
            ./tests/integration/Service.ps1 | Where-Object { $_ -cmatch '  FAIL  |^        |passed, ' }
          }
          exit 0
