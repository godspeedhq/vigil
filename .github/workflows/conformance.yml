# Runs the shared conformance suite on every shell Vigil supports. macOS
# runners ship /bin/bash 3.2, the oldest bash Vigil must run on.
name: conformance

# Pull requests are tested once, as pull_request runs; pushes are tested only
# on main. Any other branch can be run by hand:
#   gh workflow run conformance --ref <branch>
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: licence and disclaimer in every script
        run: /bin/bash tools/check-headers.sh
      - name: bash version
        run: /bin/bash --version | head -1
      # Early, so a pull request with only a pack in it hears quickly what to
      # fix. pwsh, on both runners, parses the Windows scripts.
      - name: every pack, checked and run (/bin/bash)
        run: /bin/bash tools/check-pack.sh --run
      - name: conformance (/bin/bash)
        run: /bin/bash tests/run-conformance.sh
      - name: integration (/bin/bash)
        run: /bin/bash tests/integration/run-job.sh
      - name: supervisor (/bin/bash)
        run: /bin/bash tests/integration/supervise.sh
      - name: max_runtime (/bin/bash)
        run: /bin/bash tests/integration/max-runtime.sh
      - name: uncertain runs (/bin/bash)
        run: /bin/bash tests/integration/uncertain.sh
      - name: secrets (/bin/bash)
        run: /bin/bash tests/integration/secrets.sh
      - name: precheck (/bin/bash)
        run: /bin/bash tests/integration/precheck.sh
      - name: what cannot be read is not missing (/bin/bash)
        run: /bin/bash tests/integration/unreadable.sh
      - name: vigil config (/bin/bash)
        run: /bin/bash tests/integration/config-edit.sh
      - name: a packaged program (/bin/bash)
        run: /bin/bash tests/integration/packaged.sh
      - name: secret stores (/bin/bash)
        run: /bin/bash tests/integration/stores.sh
      - name: metrics backends (/bin/bash)
        run: /bin/bash tests/integration/backends.sh
      - name: OpenSSH server for the sftp source test
        if: runner.os == 'Linux'
        run: test -x /usr/sbin/sshd || { sudo apt-get update -q && sudo apt-get install -y -q openssh-server; }
      - name: sources and the fetcher (/bin/bash)
        run: /bin/bash tests/integration/fetch.sh
      - name: log forwarding (/bin/bash)
        run: /bin/bash tests/integration/logs.sh
      - name: self update (/bin/bash)
        run: /bin/bash tests/integration/self-update.sh
        timeout-minutes: 10
      - name: packs (/bin/bash)
        run: /bin/bash tests/integration/pack.sh
      - name: the base pack (/bin/bash)
        run: /bin/bash tests/integration/base-pack.sh
      # Not a test: its output becomes the Logs and output pages.
      - name: the tour for the documentation (/bin/bash)
        run: /bin/bash tools/docs/tour.sh
        timeout-minutes: 6
      - name: data format (/bin/bash)
        run: /bin/bash tests/integration/format.sh
        timeout-minutes: 5
      - name: upgrade from the latest release (/bin/bash)
        run: /bin/bash tests/integration/upgrade.sh
        timeout-minutes: 10
      - name: the version in the configuration (/bin/bash)
        run: /bin/bash tests/integration/version-config.sh
        timeout-minutes: 15
      - name: service registration (/bin/bash)
        run: /bin/bash tests/integration/service.sh
        timeout-minutes: 15
      - name: init and uninstall (/bin/bash)
        run: /bin/bash tests/integration/init-uninstall.sh
      - name: installer (/bin/bash)
        run: /bin/bash tests/integration/install.sh

  # The service packs against real servers: PostgreSQL and nginx in Docker,
  # as tests/integration/backends runs them (compose.services.yaml). The
  # runner has psql. macOS runners have no Docker; the scripts are the same.
  service-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL 18 and nginx
        run: |
          pg_super=$(openssl rand -hex 16)
          pg_monitor=$(openssl rand -hex 16)
          echo "::add-mask::$pg_super"
          echo "::add-mask::$pg_monitor"
          echo "VIGIL_IT_PG_PASSWORD=$pg_monitor" >> "$GITHUB_ENV"
          services=$PWD/tests/integration/backends/configs/services
          docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD="$pg_super" -e POSTGRES_MONITOR_PASSWORD="$pg_monitor" \
            -v "$services/postgres/monitor-role.sh:/docker-entrypoint-initdb.d/monitor-role.sh:ro" \
            postgres:18.1-alpine
          docker run -d --name ngx -p 127.0.0.1:9082:80 \
            -v "$services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.30.5-alpine
          # Each answers once it is ready: the role exists only after the
          # init script, and nginx resets connections while it starts.
          pg=''; ngx=''
          for i in $(seq 1 60); do
            [ -n "$pg" ] || { pg_isready -q -h 127.0.0.1 -p 5432 && docker exec pg psql -U postgres -Atc "SELECT 1 FROM pg_roles WHERE rolname = 'vigil_monitor'" 2> /dev/null | grep -q 1 && pg=up; }
            [ -n "$ngx" ] || { curl -fsS -o /dev/null http://127.0.0.1:9082/nginx_status 2> /dev/null && ngx=up; }
            [ -n "$pg" ] && [ -n "$ngx" ] && break
            sleep 2
          done
          [ -n "$pg" ] || { echo "PostgreSQL never became ready"; docker logs pg; exit 1; }
          [ -n "$ngx" ] || { echo "nginx never became ready"; docker logs ngx; exit 1; }
          curl -fsS http://127.0.0.1:9082/nginx_status
      - name: the service packs (/bin/bash)
        env:
          VIGIL_IT_PG_HOST: 127.0.0.1
          VIGIL_IT_PG_PORT: '5432'
          VIGIL_IT_NGINX_URL: http://127.0.0.1:9082/nginx_status
        run: /bin/bash tests/integration/service-packs.sh

  # The .deb and .rpm (backlog 30, step 1), built as a release builds them,
  # for two versions: each installed, upgraded and removed in a clean
  # container of its distributions, and once on the runner itself, where
  # systemd runs, for the service.
  linux-packages:
    name: linux packages (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [debian:13, ubuntu:24.04, fedora:43, rockylinux/rockylinux:9, systemd]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: build 0.0.1 and 0.0.2
        run: |
          bash tools/release/package.sh 0.0.1 "$RUNNER_TEMP/old" > /dev/null
          bash tools/release/package.sh 0.0.2 "$RUNNER_TEMP/new" > /dev/null
          ls -l "$RUNNER_TEMP"/old/vigil[_-]0.0.1* "$RUNNER_TEMP"/new/vigil[_-]0.0.2*
      - name: install, upgrade, remove (${{ matrix.target }})
        if: matrix.target != 'systemd'
        run: |
          case "${{ matrix.target }}" in
            debian:* | ubuntu:*) prep='apt-get update -q > /dev/null' ;;
            *) prep=: ;;
          esac
          docker run --rm -v "$RUNNER_TEMP:/pk:ro" -v "$PWD:/src:ro" "${{ matrix.target }}" \
            sh -c "$prep && sh /src/tests/packages/linux.sh /pk/old /pk/new"
      - name: install, upgrade, remove, with systemd (the runner)
        if: matrix.target == 'systemd'
        run: sudo sh tests/packages/linux.sh "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"

  # The Homebrew formula and the Scoop manifest (backlog 30, step 2), each
  # from a tap or bucket of its own, with archives built here.
  homebrew:
    name: homebrew formula (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: build 0.0.1 and 0.0.2
        run: |
          bash tools/release/package.sh 0.0.1 "$RUNNER_TEMP/old" > /dev/null
          bash tools/release/package.sh 0.0.2 "$RUNNER_TEMP/new" > /dev/null
      - name: install, run, upgrade, remove
        run: bash tests/packages/homebrew.sh "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"

  # The MacPorts port (backlog 30, step 3), from its Portfile, with archives
  # built here, on MacPorts' own installer for the runner's macOS.
  macports:
    name: macports port (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: install MacPorts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major=$(sw_vers -productVersion | cut -d. -f1)
          url=$(gh api repos/macports/macports-base/releases/latest \
            --jq ".assets[].browser_download_url | select(test(\"-${major}-[A-Za-z]+\\\\.pkg$\"))" | head -n 1)
          [ -n "$url" ] || { echo "no MacPorts installer for macOS $major"; exit 1; }
          echo "$url"
          curl -fsSL -o "$RUNNER_TEMP/MacPorts.pkg" "$url"
          sudo installer -pkg "$RUNNER_TEMP/MacPorts.pkg" -target /
          # The ports tree, for the github PortGroup the Portfile uses.
          sudo /opt/local/bin/port -q selfupdate
          /opt/local/bin/port version
      - name: build 0.0.1 and 0.0.2
        run: |
          bash tools/release/package.sh 0.0.1 "$RUNNER_TEMP/old" > /dev/null
          bash tools/release/package.sh 0.0.2 "$RUNNER_TEMP/new" > /dev/null
      - name: install, load, upgrade, remove
        run: sudo bash tests/packages/macports.sh "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"

  scoop:
    name: scoop manifest (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: build 0.0.1 and 0.0.2, and their manifests
        shell: bash
        run: |
          for v in old:0.0.1 new:0.0.2; do
            d=${v%%:*}
            bash tools/release/package.sh "${v#*:}" "$RUNNER_TEMP/$d" > /dev/null
            VIGIL_PACKAGE_URL="http://127.0.0.1:8765/$d" bash tools/release/tap-bucket.sh "${v#*:}" "$RUNNER_TEMP/$d/SHA256SUMS" "$RUNNER_TEMP/$d-manifest"
          done
      - name: install, run, update, remove
        shell: pwsh
        run: |
          $server = Start-Process -FilePath python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $env:RUNNER_TEMP -PassThru -WindowStyle Hidden
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/packages/Scoop.ps1 `
              -Old "$env:RUNNER_TEMP\old-manifest\bucket\vigil.json" -New "$env:RUNNER_TEMP\new-manifest\bucket\vigil.json" `
              -OldVersion 0.0.1 -NewVersion 0.0.2
            exit $LASTEXITCODE
          }
          finally { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }

  # Windows in six jobs side by side: each PowerShell, in three parts of
  # about 12 minutes (core, sources, install), where one job took 35. Git
  # Bash and the command-line round trip need only one PowerShell, and run
  # with 5.1.
  windows-part:
    name: windows (${{ matrix.label }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        label: [PowerShell 5.1, PowerShell 7]
        part: [core, sources, install]
        include:
          - label: PowerShell 5.1
            shell: powershell
          - label: PowerShell 7
            shell: pwsh
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      # core: conformance, runs, the supervisor, secrets, backends, packs.
      - name: conformance
        if: matrix.part == 'core'
        run: ./tests/Run-Conformance.ps1
      - name: conformance (Git Bash)
        if: matrix.part == 'core' && matrix.shell == 'powershell'
        shell: bash
        run: bash tests/run-conformance.sh
      - name: command-line round trip (CommandLineToArgvW)
        if: matrix.part == 'core' && matrix.shell == 'powershell'
        run: ./tests/Test-CommandLineRoundTrip.ps1
      - name: integration
        if: matrix.part == 'core'
        run: ./tests/integration/Run-Job.ps1
      - name: supervisor
        if: matrix.part == 'core'
        run: ./tests/integration/Supervise.ps1
      - name: max_runtime
        if: matrix.part == 'core'
        run: ./tests/integration/Max-Runtime.ps1
      - name: uncertain runs
        if: matrix.part == 'core'
        run: ./tests/integration/Uncertain.ps1
      # As under a logon WMI refuses (SSH, a task without a stored password):
      # ownership is proven from the kernel instead.
      - name: max_runtime and uncertain runs, without WMI
        if: matrix.part == 'core' && matrix.shell == 'powershell'
        env:
          VIGIL_TEST_NO_WMI: '1'
        run: |
          ./tests/integration/Max-Runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/integration/Uncertain.ps1
      - name: secrets
        if: matrix.part == 'core'
        run: ./tests/integration/Secrets.ps1
      - name: secrets (Git Bash)
        if: matrix.part == 'core' && matrix.shell == 'powershell'
        shell: bash
        run: bash tests/integration/secrets.sh
      - name: precheck
        if: matrix.part == 'core'
        run: ./tests/integration/Precheck.ps1
      - name: what cannot be read is not missing
        if: matrix.part == 'core'
        run: ./tests/integration/Unreadable.ps1
      - name: vigil config
        if: matrix.part == 'core'
        run: ./tests/integration/Config-Edit.ps1
      - name: a packaged program
        if: matrix.part == 'core'
        run: ./tests/integration/Packaged.ps1
      - name: secret stores
        if: matrix.part == 'core'
        run: ./tests/integration/Stores.ps1
      - name: metrics backends
        if: matrix.part == 'core'
        run: ./tests/integration/Backends.ps1
      - name: packs
        if: matrix.part == 'core'
        run: ./tests/integration/Pack.ps1
      - name: the base pack
        if: matrix.part == 'core'
        run: ./tests/integration/Base-Pack.ps1
      - name: every pack's Windows scripts, run
        if: matrix.part == 'core'
        run: ./tools/Check-Pack.ps1
      # The runner image has PostgreSQL installed, its service stopped, with
      # the superuser's password in PGPASSWORD; the pack's role is made here.
      - name: the postgres pack
        if: matrix.part == 'core'
        run: |
          $monitor = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$monitor"
          Get-Service -Name 'postgresql*' | Set-Service -StartupType Manual -PassThru | Start-Service
          $psql = Join-Path $env:PGBIN 'psql.exe'
          & $psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE vigil_monitor LOGIN PASSWORD '$monitor' IN ROLE pg_monitor"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item Env:\PGPASSWORD
          $env:VIGIL_IT_PG_HOST = '127.0.0.1'
          $env:VIGIL_IT_PG_PASSWORD = $monitor
          ./tests/integration/Service-Packs.ps1

      # sources: fetching, log forwarding, self update.
      - name: OpenSSH server for the sftp source test
        if: matrix.part == 'sources'
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
      - name: sources and the fetcher
        if: matrix.part == 'sources'
        run: ./tests/integration/Fetch.ps1
      - name: log forwarding
        if: matrix.part == 'sources'
        run: ./tests/integration/Logs.ps1
      - name: self update
        if: matrix.part == 'sources'
        run: ./tests/integration/Self-Update.ps1
        timeout-minutes: 15

      # install: data formats, upgrades, the version in the configuration,
      # the service and the installer.
      # Not a test: its output becomes the Logs and output pages.
      - name: the tour for the documentation
        if: matrix.part == 'install' && matrix.shell == 'powershell'
        run: ./tools/docs/Tour.ps1
        timeout-minutes: 6
      - name: data format
        if: matrix.part == 'install'
        run: ./tests/integration/Format.ps1
        timeout-minutes: 5
      - name: upgrade from the latest release
        if: matrix.part == 'install'
        run: ./tests/integration/Upgrade.ps1
        timeout-minutes: 15
      - name: the version in the configuration
        if: matrix.part == 'install'
        run: ./tests/integration/Version-Config.ps1
        timeout-minutes: 30
      - name: service registration
        if: matrix.part == 'install'
        run: ./tests/integration/Service.ps1
        timeout-minutes: 15
      - name: init and uninstall
        if: matrix.part == 'install'
        run: ./tests/integration/Init-Uninstall.ps1
      - name: installer
        if: matrix.part == 'install'
        run: ./tests/integration/Install.ps1

  # The checks main requires are named for each PowerShell: each passes once
  # all six parts have passed.
  windows:
    name: windows (${{ matrix.label }})
    needs: windows-part
    if: always()
    strategy:
      matrix:
        label: [PowerShell 5.1, PowerShell 7]
    runs-on: ubuntu-latest
    steps:
      - name: every Windows part passed
        run: test "${{ needs.windows-part.result }}" = success
