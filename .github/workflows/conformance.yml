# Runs the shared conformance suite on every shell Vigil supports. macOS
# runners ship /bin/bash 3.2, the oldest bash Vigil must run on.
name: conformance

# Pull requests are tested once, as pull_request runs; pushes are tested only
# on main. Any other branch can be run by hand:
#   gh workflow run conformance --ref <branch>
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: bash version
        run: /bin/bash --version | head -1
      - name: conformance (/bin/bash)
        run: /bin/bash tests/run-conformance.sh
      - name: integration (/bin/bash)
        run: /bin/bash tests/integration/run-job.sh
      - name: supervisor (/bin/bash)
        run: /bin/bash tests/integration/supervise.sh
      - name: max_runtime (/bin/bash)
        run: /bin/bash tests/integration/max-runtime.sh
      - name: uncertain runs (/bin/bash)
        run: /bin/bash tests/integration/uncertain.sh
      - name: secrets (/bin/bash)
        run: /bin/bash tests/integration/secrets.sh
      - name: precheck (/bin/bash)
        run: /bin/bash tests/integration/precheck.sh
      - name: secret stores (/bin/bash)
        run: /bin/bash tests/integration/stores.sh
      - name: metrics backends (/bin/bash)
        run: /bin/bash tests/integration/backends.sh
      - name: service registration (/bin/bash)
        run: /bin/bash tests/integration/service.sh
        timeout-minutes: 15
      - name: init and uninstall (/bin/bash)
        run: /bin/bash tests/integration/init-uninstall.sh
      - name: installer (/bin/bash)
        run: /bin/bash tests/integration/install.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: conformance (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Run-Conformance.ps1
      - name: conformance (PowerShell 7)
        shell: pwsh
        run: ./tests/Run-Conformance.ps1
      - name: conformance (Git Bash)
        shell: bash
        run: bash tests/run-conformance.sh
      - name: command-line round trip (CommandLineToArgvW)
        shell: powershell
        run: ./tests/Test-CommandLineRoundTrip.ps1
      - name: integration (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Run-Job.ps1
      - name: supervisor (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Supervise.ps1
      - name: max_runtime (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Max-Runtime.ps1
      - name: uncertain runs (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Uncertain.ps1
      - name: secrets (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Secrets.ps1
      - name: precheck (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Precheck.ps1
      - name: secret stores (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Stores.ps1
      - name: metrics backends (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Backends.ps1
      - name: service registration (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Service.ps1
        timeout-minutes: 15
      - name: init and uninstall (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Init-Uninstall.ps1
      - name: installer (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/integration/Install.ps1
      - name: integration (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Run-Job.ps1
      - name: supervisor (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Supervise.ps1
      - name: max_runtime (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Max-Runtime.ps1
      - name: uncertain runs (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Uncertain.ps1
      - name: secrets (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Secrets.ps1
      - name: precheck (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Precheck.ps1
      - name: secret stores (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Stores.ps1
      - name: metrics backends (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Backends.ps1
      - name: service registration (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Service.ps1
        timeout-minutes: 15
      - name: init and uninstall (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Init-Uninstall.ps1
      - name: installer (PowerShell 7)
        shell: pwsh
        run: ./tests/integration/Install.ps1
      - name: secrets (Git Bash)
        shell: bash
        run: bash tests/integration/secrets.sh
