# Runs the shared conformance suite on every shell Vigil supports. macOS
# runners ship /bin/bash 3.2, the oldest bash Vigil must run on.
name: conformance

# Pull requests are tested once, as pull_request runs; pushes are tested only
# on main. Any other branch can be run by hand:
#   gh workflow run conformance --ref <branch>
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # What a pull request changes, as three classes:
  # - documentation only: Markdown at the top, backlog/ and
  #   packaging/README.md. The suites below are skipped, and the checks main
  #   requires pass on that; the pages workflow still builds the site.
  # - packs only: the packs, besides documentation (packs/, the pack
  #   checkers, a pack's generator in a folder of its own in tools/ (not
  #   tools/docs or tools/release), the pack tests and the servers they run
  #   against in tests/integration/backends). A pack is scripts beside Vigil and cannot
  #   break it, and it comes with evidence of working against the real
  #   service (CONTRIBUTING.md). So one Linux job, packs, checks it in place
  #   of everything else, and the checks main requires pass when it has.
  # - anything else, the workflow itself included: everything.
  # A push to main is classed the same way, by what it changes since the
  # commit before it, so a merged pack does not run the suites again. The
  # Test evidence page reads the newest run on main whose suites ran. A run
  # by hand, or a push whose commit before is unknown, runs everything.
  #
  # Whatever the class, the packs with Java whose Java the change can break
  # (java_packs, for the pack-java job): a pack changed in packs/<name>/ or
  # tools/<name>/ that has a _*.java; every pack carrying the probe when
  # tools/probe/ changes; every pack with Java when the release tools or
  # this workflow change, or when everything runs. Found from the packs
  # themselves, so a new pack with Java needs no change here.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
      packs_only: ${{ steps.files.outputs.packs_only }}
      java_packs: ${{ steps.files.outputs.java_packs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: the files this change touches
        id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          docs_only=false packs_only=false
          docs='^([^/]+\.md|backlog/.*|packaging/README\.md)$'
          packs='^(packs/.*|tools/(check-pack\.sh|Check-Pack\.ps1|new-pack\.sh)|tools/[a-z0-9-]+/.*|tests/integration/(service-packs\.sh|Service-Packs\.ps1|base-pack\.sh|Base-Pack\.ps1|pack\.sh|Pack\.ps1)|tests/integration/backends/.*)$'
          # tools/docs and tools/release are Vigil's own: never packs.
          notpacks='^tools/(docs|release)/'
          case $GITHUB_EVENT_NAME in pull_request | push) ;; *) BASE='' ;; esac
          # No commit before (a new branch, or one this clone lacks): everything.
          case $BASE in '' | *[!0]* ) ;; *) BASE='' ;; esac
          [ -z "$BASE" ] || git cat-file -e "$BASE^{commit}" 2> /dev/null || BASE=''
          if [ -n "$BASE" ]; then
              files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
              printf '%s\n' "$files"
              if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Ev "$docs" > /dev/null; then
                  docs_only=true
              elif [ -n "$files" ] && ! printf '%s\n' "$files" | grep -Ev "$docs" | grep -Ev "$packs" > /dev/null &&
                  ! printf '%s\n' "$files" | grep -E "$notpacks" > /dev/null; then
                  packs_only=true
              fi
          fi
          # The packs with Java, and those carrying the probe.
          java=$(ls packs/*/*/_*.java 2> /dev/null | cut -d/ -f2 | sort -u | tr '\n' ' ')
          probe=$(ls packs/*/*/_probe.java 2> /dev/null | cut -d/ -f2 | sort -u | tr '\n' ' ')
          if [ -z "$BASE" ]; then
              java_packs=$java
          else
              java_packs=$(printf '%s\n' "$files" | while IFS= read -r f; do
                  case $f in
                      tools/release/* | .github/workflows/conformance.yml) printf '%s\n' $java ;;
                      tools/probe/*) printf '%s\n' $probe ;;
                      packs/*/* | tools/*/*)
                          n=${f#*/}; n=${n%%/*}
                          case " $java " in *" $n "*) printf '%s\n' "$n" ;; esac ;;
                  esac
              done | sort -u | tr '\n' ' ')
          fi
          java_packs=$(printf '%s' "$java_packs" | sed 's/ *$//')
          echo "docs only: $docs_only; packs only: $packs_only; packs whose Java to check: ${java_packs:-none}"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "packs_only=$packs_only" >> "$GITHUB_OUTPUT"
          echo "java_packs=$java_packs" >> "$GITHUB_OUTPUT"

  # The suite in three parts on each runner, side by side: most of its time
  # is waiting on the clock (a schedule, a max_runtime, a supervisor's next
  # tick), so parts in parallel finish in a third of the time. Each part
  # about ten minutes, by the steps' times on the runners. The docs' pages
  # (tools/docs) read the sources part by its name.
  bash-suite:
    name: bash suite (${{ matrix.os }}, ${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.packs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        part: [engine, sources, install]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: bash version
        run: /bin/bash --version | head -1

      # engine: conformance, runs, the supervisor, secrets, backends, packs.
      - name: licence and disclaimer in every script
        if: matrix.part == 'engine'
        run: /bin/bash tools/check-headers.sh
      # Early, so a pull request with only a pack in it hears quickly what to
      # fix. pwsh, on both runners, parses the Windows scripts.
      - name: every pack, checked and run (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tools/check-pack.sh --run
      # Each pack's page shows its metrics as the scripts' headers say them.
      - name: every pack's grid, as its scripts say
        if: matrix.part == 'engine'
        run: python3 tools/pack-grid.py . --check
      - name: conformance (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/run-conformance.sh
      - name: integration (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/run-job.sh
      - name: supervisor (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/supervise.sh
      - name: max_runtime (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/max-runtime.sh
      - name: uncertain runs (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/uncertain.sh
      - name: run accounting (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/run-accounting.sh
      - name: crash points (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/crash.sh
      - name: secrets (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/secrets.sh
      - name: precheck (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/precheck.sh
      - name: doctor (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/doctor.sh
      - name: what cannot be read is not missing (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/unreadable.sh
      - name: vigil config (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/config-edit.sh
      - name: a packaged program (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/packaged.sh
      - name: secret stores (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/stores.sh
      - name: metrics backends (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/backends.sh
      - name: packs (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/pack.sh
      - name: the base pack (/bin/bash)
        if: matrix.part == 'engine'
        run: /bin/bash tests/integration/base-pack.sh

      # sources: fetching, log forwarding, self update, the tour, upgrades.
      - name: OpenSSH server for the sftp source test
        if: matrix.part == 'sources' && runner.os == 'Linux'
        run: test -x /usr/sbin/sshd || { sudo apt-get update -q && sudo apt-get install -y -q openssh-server; }
      - name: sources and the fetcher (/bin/bash)
        if: matrix.part == 'sources'
        run: /bin/bash tests/integration/fetch.sh
        # sshd is here (macOS has it): the sftp test must run, never skip.
        env:
          VIGIL_IT_REQUIRE_SFTP: '1'
      - name: log forwarding (/bin/bash)
        if: matrix.part == 'sources'
        run: /bin/bash tests/integration/logs.sh
      - name: self update (/bin/bash)
        if: matrix.part == 'sources'
        run: /bin/bash tests/integration/self-update.sh
        timeout-minutes: 10
      # Not a test: its output becomes the Logs and output pages.
      - name: the tour for the documentation (/bin/bash)
        if: matrix.part == 'sources'
        run: /bin/bash tools/docs/tour.sh
        timeout-minutes: 6
      - name: data format (/bin/bash)
        if: matrix.part == 'sources'
        run: /bin/bash tests/integration/format.sh
        timeout-minutes: 5
      - name: upgrade from the latest release (/bin/bash)
        if: matrix.part == 'sources'
        run: /bin/bash tests/integration/upgrade.sh
        timeout-minutes: 10

      # install: the version in the configuration, the service, the installer.
      - name: the version in the configuration (/bin/bash)
        if: matrix.part == 'install'
        run: /bin/bash tests/integration/version-config.sh
        timeout-minutes: 15
      - name: service registration (/bin/bash)
        if: matrix.part == 'install'
        run: /bin/bash tests/integration/service.sh
        timeout-minutes: 15
      - name: init and uninstall (/bin/bash)
        if: matrix.part == 'install'
        run: /bin/bash tests/integration/init-uninstall.sh
      - name: installer (/bin/bash)
        if: matrix.part == 'install'
        run: /bin/bash tests/integration/install.sh

  # The service packs against real servers: PostgreSQL, MySQL, MariaDB,
  # Valkey, Redis and nginx in Docker, as tests/integration/backends runs
  # them. The runner has psql and MySQL's client, which also talks to
  # MariaDB here; the runner's redis-tools gives redis-cli (8.0 when this was
  # written), older than either server. macOS runners have no Docker; the
  # scripts are the same. Run with the suites only: a pack-only change
  # brings its evidence instead.
  service-packs:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.packs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL 18, MySQL 8.4, MariaDB 11.4, Valkey 9.2, Redis 8.10 and nginx
        run: |
          pg_super=$(openssl rand -hex 16)
          pg_monitor=$(openssl rand -hex 16)
          my_root=$(openssl rand -hex 16)
          my_monitor=$(openssl rand -hex 16)
          echo "::add-mask::$pg_super"
          echo "::add-mask::$pg_monitor"
          echo "::add-mask::$my_root"
          echo "::add-mask::$my_monitor"
          echo "VIGIL_IT_PG_PASSWORD=$pg_monitor" >> "$GITHUB_ENV"
          echo "VIGIL_IT_PG_SUPER_PASSWORD=$pg_super" >> "$GITHUB_ENV"
          echo "VIGIL_IT_MYSQL_PASSWORD=$my_monitor" >> "$GITHUB_ENV"
          echo "VIGIL_IT_MYSQL_ROOT_PASSWORD=$my_root" >> "$GITHUB_ENV"
          rd_monitor=$(openssl rand -hex 16)
          rd_admin=$(openssl rand -hex 16)
          echo "::add-mask::$rd_monitor"
          echo "::add-mask::$rd_admin"
          echo "VIGIL_IT_REDIS_PASSWORD=$rd_monitor" >> "$GITHUB_ENV"
          echo "VIGIL_IT_REDIS_ADMIN_PASSWORD=$rd_admin" >> "$GITHUB_ENV"
          services=$PWD/tests/integration/backends/configs/services
          docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD="$pg_super" -e POSTGRES_MONITOR_PASSWORD="$pg_monitor" \
            -v "$services/postgres/monitor-role.sh:/docker-entrypoint-initdb.d/monitor-role.sh:ro" \
            postgres:18.1-alpine
          docker run -d --name ngx -p 127.0.0.1:9082:80 \
            -v "$services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.30.5-alpine
          docker run -d --name my -p 127.0.0.1:13306:3306 \
            -e MYSQL_ROOT_PASSWORD="$my_root" -e MONITOR_PASSWORD="$my_monitor" -e ROLE=source \
            -e REPLICATION_PASSWORD="$(openssl rand -hex 16)" \
            -v "$services/mysql/monitor-user.sh:/docker-entrypoint-initdb.d/1-monitor-user.sh:ro" \
            mysql:8.4.13 --innodb-buffer-pool-size=64M
          docker run -d --name maria -p 127.0.0.1:13316:3306 \
            -e MARIADB_ROOT_PASSWORD="$my_root" -e MONITOR_PASSWORD="$my_monitor" -e ROLE=source \
            -e REPLICATION_PASSWORD="$(openssl rand -hex 16)" \
            -v "$services/mysql/monitor-user.sh:/docker-entrypoint-initdb.d/1-monitor-user.sh:ro" \
            mariadb:11.4.13
          # Each with its users made by start.sh, as compose.redis.yaml has them.
          for r in "valkey 16379 valkey/valkey:9.2.0-alpine" "redis 16389 redis:8.10.3-alpine"; do
            set -- $r
            docker run -d --name "$1" -p "127.0.0.1:$2:6379" --entrypoint /bin/sh \
              -e ROLE=primary -e MONITOR_PASSWORD="$rd_monitor" -e ADMIN_PASSWORD="$rd_admin" \
              -e REPLICATION_PASSWORD="$(openssl rand -hex 16)" \
              -v "$services/redis/start.sh:/vigil-it/start.sh:ro" "$3" /vigil-it/start.sh
          done
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends redis-tools > /dev/null
          mysql --version
          redis-cli --version
          # Each answers once it is ready: the role and users exist only after
          # the init scripts, and nginx resets connections while it starts.
          pg=''; ngx=''; my=''; maria=''; vk=''; rd=''
          for i in $(seq 1 90); do
            [ -n "$pg" ] || { pg_isready -q -h 127.0.0.1 -p 5432 && docker exec pg psql -U postgres -Atc "SELECT 1 FROM pg_roles WHERE rolname = 'vigil_monitor'" 2> /dev/null | grep -q 1 && pg=up; }
            [ -n "$ngx" ] || { curl -fsS -o /dev/null http://127.0.0.1:9082/nginx_status 2> /dev/null && ngx=up; }
            [ -n "$my" ] || { MYSQL_PWD=$my_monitor mysql --protocol=TCP -h 127.0.0.1 -P 13306 -u vigil_monitor -N -e 'SELECT 1' > /dev/null 2>&1 && my=up; }
            [ -n "$maria" ] || { MYSQL_PWD=$my_monitor mysql --protocol=TCP -h 127.0.0.1 -P 13316 -u vigil_monitor -N -e 'SELECT 1' > /dev/null 2>&1 && maria=up; }
            [ -n "$vk" ] || { REDISCLI_AUTH=$rd_monitor redis-cli -p 16379 --user vigil_monitor PING 2> /dev/null | grep -q PONG && vk=up; }
            [ -n "$rd" ] || { REDISCLI_AUTH=$rd_monitor redis-cli -p 16389 --user vigil_monitor PING 2> /dev/null | grep -q PONG && rd=up; }
            [ -n "$pg" ] && [ -n "$ngx" ] && [ -n "$my" ] && [ -n "$maria" ] && [ -n "$vk" ] && [ -n "$rd" ] && break
            sleep 2
          done
          [ -n "$pg" ] || { echo "PostgreSQL never became ready"; docker logs pg; exit 1; }
          [ -n "$ngx" ] || { echo "nginx never became ready"; docker logs ngx; exit 1; }
          [ -n "$my" ] || { echo "MySQL never became ready"; docker logs my; exit 1; }
          [ -n "$maria" ] || { echo "MariaDB never became ready"; docker logs maria; exit 1; }
          [ -n "$vk" ] || { echo "Valkey never became ready"; docker logs valkey; exit 1; }
          [ -n "$rd" ] || { echo "Redis never became ready"; docker logs redis; exit 1; }
          curl -fsS http://127.0.0.1:9082/nginx_status
      - name: the service packs, MySQL and Valkey among them (/bin/bash)
        env:
          VIGIL_IT_PG_HOST: 127.0.0.1
          VIGIL_IT_PG_PORT: '5432'
          VIGIL_IT_MYSQL_HOST: 127.0.0.1
          VIGIL_IT_MYSQL_PORT: '13306'
          VIGIL_IT_REDIS_HOST: 127.0.0.1
          VIGIL_IT_REDIS_PORT: '16379'
          VIGIL_IT_NGINX_URL: http://127.0.0.1:9082/nginx_status
        run: /bin/bash tests/integration/service-packs.sh
      - name: the mysql pack against MariaDB, the redis pack against Redis (/bin/bash)
        env:
          VIGIL_IT_PG_HOST: ''
          VIGIL_IT_NGINX_URL: ''
          VIGIL_IT_MYSQL_HOST: 127.0.0.1
          VIGIL_IT_MYSQL_PORT: '13316'
          VIGIL_IT_REDIS_HOST: 127.0.0.1
          VIGIL_IT_REDIS_PORT: '16389'
        run: /bin/bash tests/integration/service-packs.sh
      - name: SQL Server 2022, TLS only, its certificate from a CA of this run's own
        run: |
          ms_sa=$(openssl rand -hex 16)Aa1
          ms_monitor=$(openssl rand -hex 16)Bb2
          echo "::add-mask::$ms_sa"
          echo "::add-mask::$ms_monitor"
          echo "VIGIL_IT_MSSQL_SA_PASSWORD=$ms_sa" >> "$GITHUB_ENV"
          echo "VIGIL_IT_MSSQL_PASSWORD=$ms_monitor" >> "$GITHUB_ENV"
          tls=$RUNNER_TEMP/mssql-tls
          mkdir -p "$tls" && cd "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 2 -subj '/CN=Vigil test CA' \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' 2> /dev/null
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=localhost' 2> /dev/null
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 2 -extfile server.ext 2> /dev/null
          rm -f ca.key && chmod 755 "$tls" && chmod 644 "$tls"/*
          echo "VIGIL_IT_MSSQL_CACERT=$tls/ca.crt" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          # The password from the environment, never on a command line.
          ACCEPT_EULA=Y MSSQL_PID=Developer MSSQL_SA_PASSWORD="$ms_sa" docker run -d --name mssql -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA -e MSSQL_PID -e MSSQL_SA_PASSWORD \
            -v "$PWD/tests/integration/backends/configs/services/mssql/mssql.conf:/var/opt/mssql/mssql.conf:ro" -v "$tls:/tls:ro" \
            mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
          # A sqlcmd for the pack: the runner's own, or the Go one.
          if ! command -v sqlcmd > /dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/sqlcmd.tar.bz2" https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2
            echo "92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987  $RUNNER_TEMP/sqlcmd.tar.bz2" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/sqlcmd" && tar xjf "$RUNNER_TEMP/sqlcmd.tar.bz2" -C "$RUNNER_TEMP/sqlcmd"
            echo "$RUNNER_TEMP/sqlcmd" >> "$GITHUB_PATH"
          fi
          sa() { docker exec -i mssql sh -c 'SQLCMDPASSWORD=$MSSQL_SA_PASSWORD SSL_CERT_FILE=/tls/ca.crt exec /opt/mssql-tools18/bin/sqlcmd -S tcp:localhost,1433 -U sa -Nm -l 10 -h -1 -W -b -i /dev/stdin' <<< "SET NOCOUNT ON; $1"; }
          for i in $(seq 1 90); do sa 'SELECT 1' > /dev/null 2>&1 && break; sleep 2; done
          sa 'SELECT 1' > /dev/null || { echo "SQL Server never became ready"; docker logs mssql; exit 1; }
          # The login, as packs/README.md says.
          sa "CREATE LOGIN vigil_monitor WITH PASSWORD = '$ms_monitor'; GRANT VIEW SERVER PERFORMANCE STATE, VIEW SERVER SECURITY STATE, VIEW ANY DATABASE, CONNECT ANY DATABASE TO vigil_monitor;"
          sa 'SELECT @@VERSION' | head -n 1
      - name: the mssql pack against SQL Server 2022 (/bin/bash)
        env:
          VIGIL_IT_PG_HOST: ''
          VIGIL_IT_NGINX_URL: ''
          VIGIL_IT_MYSQL_HOST: ''
          VIGIL_IT_REDIS_HOST: ''
          VIGIL_IT_MSSQL_HOST: localhost
          VIGIL_IT_MSSQL_PORT: '1433'
        run: |
          (sqlcmd --version 2>&1 || true) | head -n 3
          /bin/bash tests/integration/service-packs.sh

  # The .deb and .rpm (backlog 30, step 1), built as a release builds them,
  # for two versions: each installed, upgraded and removed in a clean
  # container of its distributions, and once on the runner itself, where
  # systemd runs, for the service.
  linux-packages:
    name: linux packages (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.packs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [debian:13, ubuntu:24.04, fedora:43, rockylinux/rockylinux:9, systemd]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: build 0.0.1 and 0.0.2
        run: |
          bash tools/release/package.sh 0.0.1 "$RUNNER_TEMP/old" > /dev/null
          bash tools/release/package.sh 0.0.2 "$RUNNER_TEMP/new" > /dev/null
          ls -l "$RUNNER_TEMP"/old/vigil[_-]0.0.1* "$RUNNER_TEMP"/new/vigil[_-]0.0.2*
      - name: install, upgrade, remove (${{ matrix.target }})
        if: matrix.target != 'systemd'
        run: |
          case "${{ matrix.target }}" in
            debian:* | ubuntu:*) prep='sh /src/tests/packages/apt-update.sh' ;;
            *) prep=: ;;
          esac
          docker run --rm -v "$RUNNER_TEMP:/pk:ro" -v "$PWD:/src:ro" "${{ matrix.target }}" \
            sh -c "$prep && sh /src/tests/packages/linux.sh /pk/old /pk/new"
      - name: install, upgrade, remove, with systemd (the runner)
        if: matrix.target == 'systemd'
        run: sudo sh tests/packages/linux.sh "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"

  # The Homebrew formula and the Scoop manifest (backlog 30, step 2), each
  # from a tap or bucket of its own, with archives built here.
  homebrew:
    name: homebrew formula (macOS)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.packs_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: build 0.0.1 and 0.0.2
        run: |
          bash tools/release/package.sh 0.0.1 "$RUNNER_TEMP/old" > /dev/null
          bash tools/release/package.sh 0.0.2 "$RUNNER_TEMP/new" > /dev/null
      - name: install, run, upgrade, remove
        run: bash tests/packages/homebrew.sh "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"

  # The MacPorts port (backlog 30, step 3), from its Portfile, with archives
  # built here, on MacPorts' own installer for the runner's macOS.
  macports:
    name: macports port (macOS)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.packs_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: install MacPorts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major=$(sw_vers -productVersion | cut -d. -f1)
          url=$(gh api repos/macports/macports-base/releases/latest \
            --jq ".assets[].browser_download_url | select(test(\"-${major}-[A-Za-z]+\\\\.pkg$\"))" | head -n 1)
          [ -n "$url" ] || { echo "no MacPorts installer for macOS $major"; exit 1; }
          echo "$url"
          curl -fsSL -o "$RUNNER_TEMP/MacPorts.pkg" "$url"
          sudo installer -pkg "$RUNNER_TEMP/MacPorts.pkg" -target /
          # The ports tree, for the github PortGroup the Portfile uses.
          sudo /opt/local/bin/port -q selfupdate
          /opt/local/bin/port version
      - name: build 0.0.1 and 0.0.2
        run: |
          bash tools/release/package.sh 0.0.1 "$RUNNER_TEMP/old" > /dev/null
          bash tools/release/package.sh 0.0.2 "$RUNNER_TEMP/new" > /dev/null
      - name: install, load, upgrade, remove
        run: sudo bash tests/packages/macports.sh "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"

  scoop:
    name: scoop manifest (Windows)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.packs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: build 0.0.1 and 0.0.2, and their manifests
        shell: bash
        run: |
          for v in old:0.0.1 new:0.0.2; do
            d=${v%%:*}
            bash tools/release/package.sh "${v#*:}" "$RUNNER_TEMP/$d" > /dev/null
            VIGIL_PACKAGE_URL="http://127.0.0.1:8765/$d" bash tools/release/tap-bucket.sh "${v#*:}" "$RUNNER_TEMP/$d/SHA256SUMS" "$RUNNER_TEMP/$d-manifest"
          done
      - name: install, run, update, remove
        shell: pwsh
        run: |
          $server = Start-Process -FilePath python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $env:RUNNER_TEMP -PassThru -WindowStyle Hidden
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/packages/Scoop.ps1 `
              -Old "$env:RUNNER_TEMP\old-manifest\bucket\vigil.json" -New "$env:RUNNER_TEMP\new-manifest\bucket\vigil.json" `
              -OldVersion 0.0.1 -NewVersion 0.0.2
            exit $LASTEXITCODE
          }
          finally { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }

  # Windows in twelve jobs side by side: each PowerShell, in six parts of
  # about ten minutes, by the steps' times on the runners; in three parts the
  # longest took 28. Most of the time is waiting on the clock (a schedule, a
  # max_runtime, a supervisor's next tick), so more parts finish sooner. Git
  # Bash and the command-line round trip need only one PowerShell, and run
  # with 5.1. The docs' pages (tools/docs) read the sources, update and
  # install parts by their names.
  windows-part:
    name: windows (${{ matrix.label }}, ${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.packs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        label: [PowerShell 5.1, PowerShell 7]
        part: [engine, crash, packs, sources, update, install]
        include:
          - label: PowerShell 5.1
            shell: powershell
          - label: PowerShell 7
            shell: pwsh
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5

      # engine: conformance, runs, the supervisor and what it answers for.
      - name: conformance
        if: matrix.part == 'engine'
        run: ./tests/Run-Conformance.ps1
      - name: conformance (Git Bash)
        if: matrix.part == 'engine' && matrix.shell == 'powershell'
        shell: bash
        run: bash tests/run-conformance.sh
      - name: command-line round trip (CommandLineToArgvW)
        if: matrix.part == 'engine' && matrix.shell == 'powershell'
        run: ./tests/Test-CommandLineRoundTrip.ps1
      - name: worker libraries (each kind loads what it can use)
        if: matrix.part == 'engine' && matrix.shell == 'powershell'
        run: ./tests/Test-WorkerLibraries.ps1
      - name: integration
        if: matrix.part == 'engine'
        run: ./tests/integration/Run-Job.ps1
      - name: supervisor
        if: matrix.part == 'engine'
        run: ./tests/integration/Supervise.ps1
      - name: max_runtime
        if: matrix.part == 'engine'
        run: ./tests/integration/Max-Runtime.ps1
      - name: uncertain runs
        if: matrix.part == 'engine'
        run: ./tests/integration/Uncertain.ps1
      - name: run accounting
        if: matrix.part == 'engine'
        run: ./tests/integration/Run-Accounting.ps1
      # As under a logon WMI refuses (SSH, a task without a stored password):
      # ownership is proven from the kernel instead.
      - name: max_runtime and uncertain runs, without WMI
        if: matrix.part == 'engine' && matrix.shell == 'powershell'
        env:
          VIGIL_TEST_NO_WMI: '1'
        run: |
          ./tests/integration/Max-Runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/integration/Uncertain.ps1

      # crash: the crash points, secrets, precheck, doctor, the configuration.
      - name: crash points
        if: matrix.part == 'crash'
        run: ./tests/integration/Crash.ps1
      - name: secrets
        if: matrix.part == 'crash'
        run: ./tests/integration/Secrets.ps1
      - name: secrets (Git Bash)
        if: matrix.part == 'crash' && matrix.shell == 'powershell'
        shell: bash
        run: bash tests/integration/secrets.sh
      - name: precheck
        if: matrix.part == 'crash'
        run: ./tests/integration/Precheck.ps1
      - name: doctor
        if: matrix.part == 'crash'
        run: ./tests/integration/Doctor.ps1
      - name: what cannot be read is not missing
        if: matrix.part == 'crash'
        run: ./tests/integration/Unreadable.ps1
      - name: vigil config
        if: matrix.part == 'crash'
        run: ./tests/integration/Config-Edit.ps1
      - name: a packaged program
        if: matrix.part == 'crash'
        run: ./tests/integration/Packaged.ps1
      - name: secret stores
        if: matrix.part == 'crash'
        run: ./tests/integration/Stores.ps1

      # packs: the backends, the pack commands, every pack's scripts.
      - name: metrics backends
        if: matrix.part == 'packs'
        run: ./tests/integration/Backends.ps1
      - name: packs
        if: matrix.part == 'packs'
        run: ./tests/integration/Pack.ps1
      - name: the base pack
        if: matrix.part == 'packs'
        run: ./tests/integration/Base-Pack.ps1
      - name: every pack's Windows scripts, run
        if: matrix.part == 'packs'
        run: ./tools/Check-Pack.ps1
      # The runner image has PostgreSQL installed, its service stopped, with
      # the superuser's password in PGPASSWORD; the pack's role is made here.
      - name: the postgres pack
        if: matrix.part == 'packs'
        run: |
          $monitor = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$monitor"
          Get-Service -Name 'postgresql*' | Set-Service -StartupType Manual -PassThru | Start-Service
          $psql = Join-Path $env:PGBIN 'psql.exe'
          & $psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE vigil_monitor LOGIN PASSWORD '$monitor' IN ROLE pg_monitor"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item Env:\PGPASSWORD
          $env:VIGIL_IT_PG_HOST = '127.0.0.1'
          $env:VIGIL_IT_PG_PASSWORD = $monitor
          ./tests/integration/Service-Packs.ps1

      # sources: fetching and log forwarding.
      - name: OpenSSH server for the sftp source test
        if: matrix.part == 'sources'
        shell: powershell
        timeout-minutes: 10
        run: Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
      - name: sources and the fetcher
        if: matrix.part == 'sources'
        run: ./tests/integration/Fetch.ps1
        # sshd was installed above: the sftp test must run, never skip.
        env:
          VIGIL_IT_REQUIRE_SFTP: '1'
      - name: log forwarding
        if: matrix.part == 'sources'
        run: ./tests/integration/Logs.ps1

      # update: self update, and the version in the configuration.
      - name: self update
        if: matrix.part == 'update'
        run: ./tests/integration/Self-Update.ps1
        timeout-minutes: 15
      - name: the version in the configuration
        if: matrix.part == 'update'
        run: ./tests/integration/Version-Config.ps1
        timeout-minutes: 30

      # install: data formats, upgrades, the service and the installer.
      # Not a test: its output becomes the Logs and output pages.
      - name: the tour for the documentation
        if: matrix.part == 'install' && matrix.shell == 'powershell'
        run: ./tools/docs/Tour.ps1
        timeout-minutes: 6
      - name: data format
        if: matrix.part == 'install'
        run: ./tests/integration/Format.ps1
        timeout-minutes: 5
      - name: upgrade from the latest release
        if: matrix.part == 'install'
        run: ./tests/integration/Upgrade.ps1
        timeout-minutes: 15
      - name: service registration
        if: matrix.part == 'install'
        run: ./tests/integration/Service.ps1
        timeout-minutes: 15
      - name: init and uninstall
        if: matrix.part == 'install'
        run: ./tests/integration/Init-Uninstall.ps1
      - name: installer
        if: matrix.part == 'install'
        run: ./tests/integration/Install.ps1

  # A pull request that changes packs only: the pack checker, on Linux, in
  # place of everything else. It checks every pack's rules, parses every
  # script (the PowerShell ones with the runner's pwsh), and runs each Linux
  # job that needs no service through a throwaway Vigil. That a pack works
  # against its service is shown by the evidence it brings.
  packs:
    needs: changes
    if: needs.changes.outputs.packs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: licence and disclaimer in every script
        run: /bin/bash tools/check-headers.sh
      - name: every pack, checked and run (/bin/bash)
        run: /bin/bash tools/check-pack.sh --run
      - name: every pack's grid, as its scripts say
        run: python3 tools/pack-grid.py . --check
      # Its archives and index; the jars are the pack-java job's, for the
      # packs the change can break.
      - name: every pack, built as a release, without its jars
        env:
          VIGIL_TEST_PACKS_NO_CLIENT: '1'
        run: /bin/bash tools/release/packs.sh packs-2099.01.01 "$RUNNER_TEMP/packs"

  # The Java of the packs the change can break (changes: java_packs), checked
  # as a release builds it (tools/release/client-check.sh): compiled against
  # every library its client.lib names, the newest too, and each platform's
  # jars built with their digests written in. So a pack whose Java does not
  # build fails here, not when a release is tagged; a change that touches no
  # pack's Java runs nothing here.
  pack-java:
    name: pack java
    needs: changes
    if: needs.changes.outputs.java_packs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: their Java, compiled against every library and built as a release
        env:
          PACKS: ${{ needs.changes.outputs.java_packs }}
        run: /bin/bash tools/release/client-check.sh $PACKS
      # The probe they carry, against MBeans made for it: every word of its
      # tables, the worst of many, states, named targets (tools/probe/test).
      - name: the probe, against MBeans made for it
        run: /bin/bash tools/probe/test/probe-test.sh

  # The checks main requires are named for each PowerShell and for each
  # bash runner. Each passes once its suite has passed (every part: twelve
  # for Windows, six for bash), or when the suite was skipped because the
  # change is documentation only, or packs only and the packs job passed;
  # and in every case only when pack-java passed or had nothing to check. A
  # gate of its own, because a skipped matrix job reports under its
  # unexpanded name, which main would wait for forever. So the parts can be
  # split or renamed without changing the checks main requires.
  windows:
    name: windows (${{ matrix.label }})
    needs: [changes, windows-part, packs, pack-java]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        label: [PowerShell 5.1, PowerShell 7]
    runs-on: ubuntu-latest
    steps:
      - name: every Windows part passed, or the change is documentation or packs only
        env:
          RESULT: ${{ needs.windows-part.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PACKS_ONLY: ${{ needs.changes.outputs.packs_only }}
          PACKS: ${{ needs.packs.result }}
          JAVA: ${{ needs.pack-java.result }}
        run: |
          # The packs' Java, when the change can break it: passed, or not run.
          case $JAVA in success | skipped) ;; *) echo "pack java: $JAVA"; exit 1 ;; esac
          test "$RESULT" = success && exit 0
          test "$RESULT" = skipped && test "$DOCS_ONLY" = true && exit 0
          test "$RESULT" = skipped && test "$PACKS_ONLY" = true && test "$PACKS" = success && exit 0
          echo "suite: $RESULT; docs only: $DOCS_ONLY; packs only: $PACKS_ONLY, packs: $PACKS"
          exit 1

  bash:
    name: bash (${{ matrix.os }})
    needs: [changes, bash-suite, packs, pack-java]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - name: the bash suite passed on both runners, or the change is documentation or packs only
        env:
          RESULT: ${{ needs.bash-suite.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PACKS_ONLY: ${{ needs.changes.outputs.packs_only }}
          PACKS: ${{ needs.packs.result }}
          JAVA: ${{ needs.pack-java.result }}
        run: |
          # The packs' Java, when the change can break it: passed, or not run.
          case $JAVA in success | skipped) ;; *) echo "pack java: $JAVA"; exit 1 ;; esac
          test "$RESULT" = success && exit 0
          test "$RESULT" = skipped && test "$DOCS_ONLY" = true && exit 0
          test "$RESULT" = skipped && test "$PACKS_ONLY" = true && test "$PACKS" = success && exit 0
          echo "suite: $RESULT; docs only: $DOCS_ONLY; packs only: $PACKS_ONLY, packs: $PACKS"
          exit 1
